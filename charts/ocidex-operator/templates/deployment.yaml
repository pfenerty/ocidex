apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocidex-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocidex-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  # maxSurge 0 so a rollout never runs two operator pods at once: with the
  # default 25% surge, replicas=1 rounds up to 1 extra pod and the two contend
  # for the lease on every upgrade. This keeps leader election a safety net for
  # a future scale-up rather than a load-bearing part of every rollout.
  #
  # Deliberately NOT `type: Recreate`, which expresses the same intent but
  # cannot be applied to a Deployment that already exists. The API server
  # defaults spec.strategy.rollingUpdate on any object created without an
  # explicit strategy, and a defaulted field is owned by no field manager —
  # so server-side apply has nothing to prune and leaves it in place, while
  # validation rejects rollingUpdate alongside type Recreate. The upgrade then
  # fails permanently with:
  #
  #   spec.strategy.rollingUpdate: Forbidden: may not be specified when
  #   strategy `type` is 'Recreate'
  #
  # An explicit `rollingUpdate: null` does not help: SSA removes only fields
  # the applier previously owned. Setting the subfields instead takes ownership
  # of them and is schema-valid against both a fresh and an existing object
  # (ocidex-vh6).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ocidex-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ocidex-operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "ocidex-operator.fullname" . }}
      terminationGracePeriodSeconds: 35
      containers:
        - name: operator
          {{- if .Values.image.tag }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- else if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElect }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: OCIDEX_SERVER
              value: {{ .Values.server.url | quote }}
            - name: OCIDEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKey.secretName }}
                  key: {{ .Values.apiKey.secretKey }}
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WATCH_NAMESPACE
              value: {{ .Values.watchNamespace | quote }}
            - name: LEADER_ELECTION_LEASE_DURATION
              value: {{ .Values.leaderElection.leaseDuration | quote }}
            - name: LEADER_ELECTION_RENEW_DEADLINE
              value: {{ .Values.leaderElection.renewDeadline | quote }}
            - name: LEADER_ELECTION_RETRY_PERIOD
              value: {{ .Values.leaderElection.retryPeriod | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
