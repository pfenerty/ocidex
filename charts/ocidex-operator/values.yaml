# OCIDex operator Helm values.
# Required: server.url must be set to the OCIDex API server URL.

image:
  repository: ghcr.io/pfenerty/ocidex-operator
  # tag defaults to Chart.appVersion (set to sha-<short> or vX.Y.Z at package time).
  # Override with --set image.tag=<tag> to pin a specific version.
  tag: "@sha256:e84c25c5d6ccc34fdea3167b52254ab1c7e0bcee7690492f9eddf3bbe29d7feb"
  pullPolicy: IfNotPresent
  # digest pins the operator image to an immutable sha256 digest and is baked in at
  # release-package time by the helm-release CI task (release builds only; empty for
  # main/dev sha builds). An explicit image.tag takes precedence over digest.
  digest: ""

# server.url is the base URL of the OCIDex API server (OCIDEX_SERVER).
# Example: "http://ocidex-api.ocidex.svc.cluster.local:8080"
server:
  url: ""

# apiKey configures where the operator reads its OCIDex API key (OCIDEX_API_KEY).
apiKey:
  secretName: ocidex-operator-secrets
  secretKey: OCIDEX_API_KEY

# watchNamespace restricts the operator to reconciling CRs in the namespaces
# listed here. Required — prevents multiple operator instances from stepping on
# each other. Accepts a comma-separated list ("ocidex-dev,ocidex").
#
# Changing this value is an operational contract, not a tuning knob: OCIRegistry
# resources carry an ocidex.io/registry-protection finalizer that only a watching
# operator removes, so any CR left in a namespace that drops off this list keeps
# its finalizer forever and leaves the namespace stuck Terminating (ocidex-1eo).
# Follow the retarget procedure in docs/OPERATIONS.md before changing it.
watchNamespace: ""

# leaderElect enables leader election for multi-replica deployments.
leaderElect: true

# leaderElection tunes the lease timings. Defaults are wider than
# controller-runtime's 15s/10s/2s because the per-request API-server timeout is
# derived as renewDeadline/2 — the 5s that controller-runtime's defaults imply is
# not enough headroom on a loaded control plane, and a single slow Lease GET
# terminates the process (ocidex-vh6). Invariants enforced at startup:
# leaseDuration > renewDeadline > retryPeriod * 1.2.
leaderElection:
  leaseDuration: 60s
  renewDeadline: 40s
  retryPeriod: 10s

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

# podSecurityContext / securityContext default to the settings the PodSecurity
# "restricted" profile requires, so the chart installs cleanly into a namespace
# labelled pod-security.kubernetes.io/enforce=restricted (ocidex-1d9). They are
# values rather than hardcoded template blocks for the same reason resources and
# leaderElection are: an operator can loosen them without forking the chart.
#
# runAsNonRoot needs no accompanying runAsUser — docker/Dockerfile builds the
# operator on gcr.io/distroless/static-debian13:nonroot, which declares USER
# 65532, and the kubelet reads the non-root assertion off the image config.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem is not required by "restricted" — it is defence in
# depth, and safe here because controller-runtime writes nothing to disk unless
# webhooks are configured (this chart configures none). Verified at runtime, not
# assumed: see the ocidex-1d9 notes.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
