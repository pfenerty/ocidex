apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ocidex.fullname" . }}-nats
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocidex.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  replicas: 1
  serviceName: {{ include "ocidex.fullname" . }}-nats
  selector:
    matchLabels:
      {{- include "ocidex.selectorLabels" (dict "root" . "component" "nats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ocidex.podLabels" (dict "root" . "component" "nats") | nindent 8 }}
    spec:
      {{- /*
      NATS uses nats.podSecurityContext / nats.securityContext rather than the
      chart-wide keys: its image declares no non-root user, so runAsNonRoot
      needs an explicit runAsUser here (ocidex-s3tu). Switching an existing
      root-owned store to that uid is a data migration, not a manifest change —
      see the upgrade caveat in values.yaml and NOTES.txt.
      */}}
      {{- with .Values.nats.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.nats.storage.emptyDir }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
      containers:
        - name: nats
          image: "{{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}"
          {{- with .Values.nats.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["-js", "--store_dir", "/data", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitoring
              containerPort: 8222
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if not .Values.nats.storage.emptyDir }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.nats.storage.storageClass }}
        storageClassName: {{ .Values.nats.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.storage.size }}
  {{- end }}
