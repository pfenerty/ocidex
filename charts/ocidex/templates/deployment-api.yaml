apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocidex.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocidex.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "ocidex.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ocidex.podLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ocidex.fullname" . }}
      terminationGracePeriodSeconds: 40
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "ocidex.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            # Private /metrics (ADR-0054): the Service and routes never reach it.
            - name: metrics
              containerPort: 9090
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            {{- include "ocidex.egressGuardEnv" . | nindent 12 }}
            - name: PORT
              value: "8080"
            - name: METRICS_ADDR
              value: ":9090"
            {{- include "ocidex.metricsEnv" . | nindent 12 }}
            - name: NATS_URL
              value: "nats://{{ include "ocidex.fullname" . }}-nats:4222"
            - name: NATS_STREAM_REPLICAS
              value: {{ .Values.api.env.natsStreamReplicas | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.api.env.environment | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.api.env.logLevel | quote }}
            - name: SIGNUP_MODE
              value: {{ .Values.api.env.signupMode | quote }}
            - name: SELF_SERVICE_NAMESPACES
              value: {{ .Values.api.env.selfServiceNamespaces | quote }}
            - name: SESSION_COOKIE_SAMESITE
              value: {{ .Values.api.env.sessionCookieSameSite | quote }}
            - name: AUTH_RATE_LIMIT
              value: {{ .Values.api.env.authRateLimit | quote }}
            - name: API_RATE_LIMIT_INGEST
              value: {{ .Values.api.env.apiRateLimitIngest | quote }}
            - name: API_RATE_LIMIT_HEAVY
              value: {{ .Values.api.env.apiRateLimitHeavy | quote }}
            {{- if .Values.api.env.trustedProxyCidrs }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.api.env.trustedProxyCidrs | quote }}
            {{- end }}
            {{- if .Values.api.env.bootstrapAdmins }}
            - name: BOOTSTRAP_ADMINS
              value: {{ .Values.api.env.bootstrapAdmins | quote }}
            {{- end }}
            {{- if .Values.api.env.frontendUrl }}
            - name: FRONTEND_URL
              value: {{ .Values.api.env.frontendUrl | quote }}
            {{- end }}
            {{- if .Values.api.env.corsAllowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.api.env.corsAllowedOrigins | quote }}
            {{- end }}
            {{- if .Values.api.env.apiBaseUrl }}
            - name: API_BASE_URL
              value: {{ .Values.api.env.apiBaseUrl | quote }}
            {{- end }}
            {{- if .Values.api.env.githubRedirectUrl }}
            - name: GITHUB_REDIRECT_URL
              value: {{ .Values.api.env.githubRedirectUrl | quote }}
            {{- end }}
            - name: SCANNER_ENABLED
              value: {{ .Values.api.env.scannerEnabled | quote }}
            - name: REGISTRY_POLLER_ENABLED
              value: {{ .Values.api.env.registryPollerEnabled | quote }}
            {{- with .Values.api.env.retention }}
            - name: RETENTION_MODE
              value: {{ .mode | quote }}
            - name: RETENTION_KEEP_LAST
              value: {{ .keepLast | quote }}
            {{- if .maxAge }}
            - name: RETENTION_MAX_AGE
              value: {{ .maxAge | quote }}
            {{- end }}
            - name: RETENTION_REGISTRY_WINDOW
              value: {{ .registryWindow | quote }}
            - name: RETENTION_INTERVAL
              value: {{ .interval | quote }}
            - name: RETENTION_BATCH
              value: {{ .batch | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
