{{- if .Values.migrate.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ocidex.fullname" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocidex.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "ocidex.podLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The schema migration runs first as an init container; encrypt-secrets
      # (ADR-051) then seals legacy plaintext registry credentials and
      # re-seals any under a non-active DATA_ENCRYPTION_KEYS key. Both read
      # DATA_ENCRYPTION_* from existingSecret.
      initContainers:
        - name: migrate
          {{- include "ocidex.migrateContainer" . | nindent 10 }}
          command: ["/ocidex", "migrate", "up"]
      containers:
        - name: encrypt-secrets
          {{- include "ocidex.migrateContainer" . | nindent 10 }}
          command: ["/ocidex", "migrate", "encrypt-secrets"]
{{- end }}
