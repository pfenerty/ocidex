apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocidex.fullname" . }}-scanner-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocidex.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner-worker
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.scannerWorker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ocidex.selectorLabels" (dict "root" . "component" "scanner-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ocidex.podLabels" (dict "root" . "component" "scanner-worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ocidex.fullname" . }}
      terminationGracePeriodSeconds: 660
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if (default dict .Values.securityContext).readOnlyRootFilesystem }}
      # syft/stereoscope unpacks every image layer into os.MkdirTemp("", "stereoscope-"),
      # i.e. /tmp, before cataloging it. With a read-only root every scan fails at
      # "mkdir /tmp/stereoscope-...: read-only file system" — total scan outage, not
      # a degraded mode (ocidex-gsip). This emptyDir is what keeps scanning possible,
      # so it is tied to the setting rather than declared unconditionally, matching
      # the nginx precedent in deployment-web.yaml.
      #
      # Node-disk backed, not medium: Memory — a multi-GB image would otherwise be
      # unpacked into the container's memory limit and OOM-kill the worker.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.scannerWorker.tmpSizeLimit }}
      {{- end }}
      containers:
        - name: scanner-worker
          image: {{ include "ocidex.image" (dict "root" . "name" "scanner-worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if (default dict .Values.securityContext).readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
          ports:
            - name: health
              containerPort: 9090
          resources:
            {{- toYaml .Values.scannerWorker.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: NATS_URL
              value: "nats://{{ include "ocidex.fullname" . }}-nats:4222"
            - name: NATS_STREAM_REPLICAS
              value: {{ .Values.scannerWorker.env.natsStreamReplicas | quote }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.scannerWorker.env.databaseMaxConnections | quote }}
            - name: SCANNER_MAX_CONCURRENCY
              value: {{ .Values.scannerWorker.env.maxConcurrency | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.scannerWorker.env.environment | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.scannerWorker.env.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
