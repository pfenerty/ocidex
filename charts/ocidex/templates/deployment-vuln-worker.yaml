{{- /*
Vulnerability worker Deployment. Runs cmd/vuln-worker, which matches stored SBOMs
against the grype vulnerability database (ADR-049) on a schedule. Singleton by design:
service.LeaderElect (a Postgres advisory lock) ensures only one replica refreshes
at a time, so this never needs KEDA and carries no NATS config.

The grype database (~3 GB, updated daily) lives on a volume at vulnWorker.db.path.
With persistence enabled it is a ReadWriteOnce PVC, so the rollout strategy is
Recreate: a surge pod could never attach the volume the old pod still holds.
*/ -}}
{{- if .Values.vulnWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocidex.fullname" . }}-vuln-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocidex.labels" . | nindent 4 }}
    app.kubernetes.io/component: vuln-worker
spec:
  replicas: {{ .Values.vulnWorker.replicas }}
  {{- if .Values.vulnWorker.db.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "ocidex.selectorLabels" (dict "root" . "component" "vuln-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ocidex.podLabels" (dict "root" . "component" "vuln-worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ocidex.fullname" . }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # The distroless nonroot user (65532) must own the database volume to write it.
        fsGroup: 65532
      volumes:
        - name: grype-db
          {{- if .Values.vulnWorker.db.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.vulnWorker.db.persistence.existingClaim | default (printf "%s-vuln-db" (include "ocidex.fullname" .)) }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.vulnWorker.db.persistence.size }}
          {{- end }}
      containers:
        - name: vuln-worker
          image: {{ include "ocidex.image" (dict "root" . "name" "vuln-worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: health
              containerPort: 9090
          resources:
            {{- toYaml .Values.vulnWorker.resources | nindent 12 }}
          volumeMounts:
            - name: grype-db
              mountPath: {{ .Values.vulnWorker.db.path }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.vulnWorker.env.databaseMaxConnections | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.vulnWorker.env.environment | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.vulnWorker.env.logLevel | quote }}
            - name: VULN_REFRESH_ENABLED
              value: {{ .Values.vulnWorker.env.refreshEnabled | quote }}
            - name: VULN_REFRESH_INTERVAL
              value: {{ .Values.vulnWorker.env.refreshInterval | quote }}
            - name: VULN_DB_DIR
              value: {{ .Values.vulnWorker.db.path | quote }}
            - name: VULN_DB_MAX_AGE
              value: {{ .Values.vulnWorker.db.maxAge | quote }}
            {{- with .Values.vulnWorker.db.updateURL }}
            - name: VULN_DB_UPDATE_URL
              value: {{ . | quote }}
            {{- end }}
            # Anything that falls back to os.TempDir lands on the database volume, not
            # the read-only root (ocidex-gsip).
            - name: TMPDIR
              value: {{ .Values.vulnWorker.db.path | quote }}
            - name: OSV_BASE_URL
              value: {{ .Values.vulnWorker.env.osvBaseURL | quote }}
            - name: OSV_TIMEOUT
              value: {{ .Values.vulnWorker.env.osvTimeout | quote }}
            - name: OSV_BATCH_SIZE
              value: {{ .Values.vulnWorker.env.osvBatchSize | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
{{- end }}
{{- if and .Values.vulnWorker.enabled .Values.vulnWorker.db.persistence.enabled (not .Values.vulnWorker.db.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ocidex.fullname" . }}-vuln-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocidex.labels" . | nindent 4 }}
    app.kubernetes.io/component: vuln-worker
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.vulnWorker.db.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.vulnWorker.db.persistence.size }}
{{- end }}
