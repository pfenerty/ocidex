# OCIDex application Helm values.
#
# Required before install:
#   kubectl create secret generic <existingSecret> \
#     --from-literal=DATABASE_URL=<postgres-connection-string> \
#     --from-literal=GITHUB_CLIENT_ID=<github-oauth-client-id> \
#     --from-literal=GITHUB_CLIENT_SECRET=<github-oauth-client-secret> \
#     --from-literal=SESSION_SECRET=$(openssl rand -hex 32)
#

# --- Images ------------------------------------------------------------------
image:
  registry: ghcr.io/pfenerty
  # tag defaults to Chart.appVersion (set to sha-<short> or vX.Y.Z at package time).
  # Override with --set image.tag=<tag> to pin a specific version.
  tag: ""
  pullPolicy: IfNotPresent
  # digests pins each component to an immutable sha256 digest and is baked in at
  # release-package time by the helm-release CI task (release builds only; empty for
  # main/dev sha builds). An explicit image.tag takes precedence over digests.
  # Keys are the component names: api, scanner-worker, oci-metadata-worker,
  # git-worker, user-enricher-worker, provenance-worker, vuln-worker, web.
  digests: {}

# --- Secrets -----------------------------------------------------------------
# Name of a pre-created Secret containing DATABASE_URL, GITHUB_CLIENT_ID,
# GITHUB_CLIENT_SECRET, and SESSION_SECRET.
existingSecret: ocidex-secrets

# --- API server --------------------------------------------------------------
api:
  replicas: 1
  env:
    environment: production
    logLevel: info
    frontendUrl: ""
    corsAllowedOrigins: ""
    apiBaseUrl: ""
    githubRedirectUrl: ""
    scannerEnabled: "true"
    registryPollerEnabled: "true"
    natsStreamReplicas: "1"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

# --- Scanner worker ----------------------------------------------------------
scannerWorker:
  # Ignored when keda.enabled=true; KEDA ScaledObject owns replica count.
  replicas: 1
  env:
    maxConcurrency: "1"
    natsStreamReplicas: "1"
    databaseMaxConnections: "3"
    logLevel: info
    environment: production
  # Caps the node ephemeral storage the /tmp emptyDir may consume while syft
  # unpacks image layers (see deployment-scanner-worker.yaml). Exceeding it
  # evicts this pod rather than filling the node's disk. Raise it if scans of
  # very large images start failing on eviction rather than on a scan error.
  # Only rendered when securityContext.readOnlyRootFilesystem is true.
  tmpSizeLimit: 5Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1500m"
      memory: "1536Mi"

# --- Enrichment workers ------------------------------------------------------
# Per-enricher worker microservices (ADR-033). Each entry in `enricherWorkers`
# becomes a Deployment (+ PodMonitor + KEDA ScaledObject) running a single
# enricher and claiming its own enricher_name partition. `consumer` is the
# JetStream durable (HintDurable in cmd/<name>/main.go) KEDA scales on.
# `enricherWorkerDefaults` holds the sizing/env shared by all of them; an entry may
# set its own `resources` to override that default for just that worker.
enricherWorkers:
  - name: oci-metadata-worker
    consumer: enrich-hint-oci-metadata
  - name: git-worker
    consumer: enrich-hint-git
  - name: user-enricher-worker
    consumer: enrich-hint-user
  - name: provenance-worker
    consumer: enrich-hint-provenance
    env:
      # Registry I/O plus a cosign verification per job, so each in-flight job
      # costs far more than the other three enrichers'. Pinned low deliberately:
      # the default fan-out of 10 is what turned a large attestation into an
      # OOMKill (ocidex-wvnp).
      maxConcurrency: "2"
    # The only enricher linking cosign + sigstore-go (ADR-037) and pulling
    # signature/attestation layers from the registry. It OOMKilled at the shared
    # 128Mi limit (ocidex-wvnp) while the other three measure 9-16Mi in the
    # homelab cluster, so it is sized on its own rather than raising the default
    # and making them pay for it.
    resources:
      requests:
        cpu: "20m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "512Mi"

enricherWorkerDefaults:
  replicas: 2
  env:
    # Jobs a worker claims and runs at once (ENRICHMENT_MAX_CONCURRENCY). Fine at
    # 10 for the cheap enrichers; per-entry `env.maxConcurrency` overrides it for
    # one that is not cheap.
    maxConcurrency: "10"
    natsStreamReplicas: "1"
    databaseMaxConnections: "3"
    logLevel: info
    environment: production
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

# --- Vulnerability worker ----------------------------------------------------
# Scheduled OSV.dev refresh of the package-keyed vulnerability store. Singleton:
# a Postgres advisory lock (service.LeaderElect) makes >1 replica safe, but 1 is
# sufficient. Talks only to Postgres and OSV.dev — no NATS, no KEDA.
vulnWorker:
  enabled: true
  replicas: 1
  env:
    databaseMaxConnections: "3"
    logLevel: info
    environment: production
    refreshEnabled: "true"
    refreshInterval: "6h"
    osvBaseURL: "https://api.osv.dev"
    osvTimeout: "30s"
    osvBatchSize: "1000"
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# --- Web frontend ------------------------------------------------------------
web:
  replicas: 1
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

# --- Migrate job -------------------------------------------------------------
# Runs `ocidex migrate up` from the api image as a pre-install/pre-upgrade hook.
# Disable only if you apply migrations out of band (e.g. `make migrate-up`).
migrate:
  enabled: true

# --- NATS JetStream ----------------------------------------------------------
nats:
  # Declared here rather than inline in the StatefulSet so Renovate's
  # helm-values manager can see and bump it.
  image:
    repository: docker.io/nats
    tag: "2-alpine"
  storage:
    emptyDir: false
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"
  # NATS has its own security context rather than reusing the chart-wide keys
  # below: docker.io/nats:2-alpine declares no non-root user in /etc/passwd, so
  # runAsNonRoot is only satisfiable with an explicit numeric runAsUser, which
  # the project's own images do not need.
  #
  # fsGroup is set for storage classes that honour it. Classes that do not
  # (local-path is a hostPath provisioner; the kubelet applies fsGroup only to
  # volume types supporting ownership management) still work on a *fresh*
  # volume, because local-path creates the volume root 0777 and nats-server
  # creates its own jetstream/ dir inside it as this uid.
  #
  # UPGRADE CAVEAT: an install predating ocidex-s3tu ran NATS as root, so its
  # store dir is 0700 root:root and uid 1000 cannot open it — NATS dies with
  # "[FTL] Can't start JetStream: storage directory is not writable". Recreate
  # the PVC; see templates/NOTES.txt. The store is a doorbell cache, not the
  # queue of record (ADR-024) — Postgres holds the jobs.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true

# --- Pod security ------------------------------------------------------------
# Defaults satisfy the PodSecurity "restricted" profile so the chart installs
# into a namespace labelled pod-security.kubernetes.io/enforce=restricted
# (ocidex-1d9). Applied to every workload the project builds itself; NATS
# carries its own equivalent block under `nats` above.
#
# runAsNonRoot needs no runAsUser: every Go runtime stage in docker/Dockerfile
# is gcr.io/distroless/static-debian13:nonroot and docker/web/Dockerfile is
# cgr.dev/chainguard/nginx, both of which declare USER 65532 in the image
# config, which is where the kubelet reads the non-root assertion from.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# readOnlyRootFilesystem is defence in depth, not a "restricted" requirement.
# Two workloads write to their own filesystem and mount emptyDirs over exactly
# the paths they need rather than dropping this setting: nginx (/run and
# /var/lib/nginx/tmp, deployment-web.yaml) and the scanner worker, whose syft
# dependency unpacks image layers into /tmp (deployment-scanner-worker.yaml).
# Adding a workload that shells out, unpacks archives, or caches to disk means
# auditing it against this setting — ocidex-gsip was six days of total scan
# outage from missing that step.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

# --- KEDA (optional) ---------------------------------------------------------
# Requires the KEDA operator to be installed in the cluster.
# When enabled, the scanner-worker Deployment has no replica count set;
# KEDA's ScaledObject manages scaling based on NATS JetStream consumer lag.
keda:
  enabled: false
  scanner:
    minReplicas: 1
    maxReplicas: 5
    stream: SCANS
    consumer: scanner-worker
    lagThreshold: "5"
    activationLagThreshold: "1"
  enrichment:
    # Shared scaling bounds for every per-enricher worker; the per-worker
    # JetStream consumer comes from enricherWorkers[].consumer.
    minReplicas: 1
    maxReplicas: 4
    stream: ENRICHMENTS
    lagThreshold: "10"
    activationLagThreshold: "1"

# --- Monitoring (optional) ---------------------------------------------------
# Requires the Prometheus Operator to be installed.
monitoring:
  enabled: false
  # Additional labels to add to PodMonitor resources (e.g. for label-based
  # Prometheus scrape selection).
  additionalLabels: {}

# --- Gateway API (optional) --------------------------------------------------
# Requires Gateway API CRDs (v1) and a conformant Gateway controller (e.g. Cilium).
#
# The web container serves static assets only — it contains no reverse proxy.
# The webHostname HTTPRoute is what routes /api, /auth, /health and /ready to the
# API, giving the SPA a same-origin API. With gatewayApi.enabled=false you must
# supply that routing yourself, either with equivalent Ingress rules or by
# building the frontend with VITE_API_URL set to the API's own origin (and
# listing the frontend origin in api.env.corsAllowedOrigins).
gatewayApi:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  apiHostname: ""
  webHostname: ""
  tlsSecretName: ""

# --- Cilium network policies (optional) --------------------------------------
# Requires Cilium CNI with network policy enforcement enabled.
cilium:
  enabled: false
