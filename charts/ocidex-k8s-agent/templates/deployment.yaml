apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocidex-k8s-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocidex-k8s-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  # maxSurge 0 so a rollout never runs two agents at once. Two agents are not merely
  # wasteful: each push REPLACES the cluster's whole inventory (ADR-044 K7), so two
  # overlapping snapshot cycles would make the stored inventory alternate between two
  # observations instead of converging on one. See charts/ocidex-operator/templates/
  # deployment.yaml for why this is expressed as maxSurge 0 rather than `type: Recreate`.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ocidex-k8s-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ocidex-k8s-agent.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "ocidex-k8s-agent.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: k8s-agent
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.image.tag }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- else if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 9090
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: OCIDEX_SERVER
              value: {{ .Values.server.url | quote }}
            - name: OCIDEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKey.secretName }}
                  key: {{ .Values.apiKey.secretKey }}
            - name: OCIDEX_CLUSTER_ID
              value: {{ .Values.cluster.id | quote }}
            - name: OCIDEX_NAMESPACES
              value: {{ join "," .Values.namespaces | quote }}
            - name: OCIDEX_REPORT_INTERVAL
              value: {{ .Values.reportInterval | quote }}
            - name: HEALTH_ADDR
              value: ":9090"
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
