{{- if .Values.apiKey.value }}
# Created only when apiKey.value is set; otherwise apiKey.secretName must already exist.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.apiKey.secretName }}
  labels:
    {{- include "ocidex-k8s-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiKey.secretKey }}: {{ .Values.apiKey.value | quote }}
{{- end }}
