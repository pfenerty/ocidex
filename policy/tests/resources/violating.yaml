# Negative controls. Each fixture violates exactly one thing, so kyverno-test.yaml can
# assert WHICH rule fires rather than just "something failed" — a check that only ever
# reports green is worse than no check (ocidex-9yq4).
#
# bad-privileged: the PodSecurity restricted violations that shipped in ocidex-1d9.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-privileged
spec:
  selector:
    matchLabels:
      app: bad-privileged
  template:
    metadata:
      labels:
        app: bad-privileged
    spec:
      containers:
        - name: app
          image: example/app:1
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
---
# bad-readonly-root: restricted-compliant, but drops the chart-wide readOnlyRootFilesystem.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-readonly-root
spec:
  selector:
    matchLabels:
      app: bad-readonly-root
  template:
    metadata:
      labels:
        app: bad-readonly-root
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: example/app:1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
# bad-scanner: ocidex-gsip exactly — read-only root, no writable /tmp, no volumeMounts key
# at all (the shape that slips past a kyverno existence anchor).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-scanner
spec:
  selector:
    matchLabels:
      app: bad-scanner
  template:
    metadata:
      labels:
        app: bad-scanner
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scanner-worker
          image: example/scanner-worker:1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
# bad-web: has a volumeMounts list, but /var/lib/nginx/tmp is missing from it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-web
spec:
  selector:
    matchLabels:
      app: bad-web
  template:
    metadata:
      labels:
        app: bad-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: run
          emptyDir: {}
      containers:
        - name: web
          image: example/web:1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: run
              mountPath: /run
---
# bad-cron: a workload kind the writable-path rules cannot reach into.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bad-cron
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: app
              image: example/app:1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
---
# bad-vuln: read-only root and the database volume mounted at the wrong path — grype
# would fail to install its database (ADR-049).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-vuln
spec:
  selector:
    matchLabels:
      app: bad-vuln
  template:
    metadata:
      labels:
        app: bad-vuln
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: grype-db
          emptyDir: {}
      containers:
        - name: vuln-worker
          image: example/vuln-worker:1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: grype-db
              mountPath: /data
---
# bad-image-ref: a digest written into the tag field — the operator outage in ocidex-35rx.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image-ref
spec:
  selector:
    matchLabels:
      app: bad-image-ref
  template:
    metadata:
      labels:
        app: bad-image-ref
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: example/app:@sha256:e84c25c5d6ccc34fdea3167b52254ab1c7e0bcee7690492f9eddf3bbe29d7feb
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
