apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-set-status-pending-ocidex-push
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
    - name: pipeline-run-name
      type: string
  results:
    - name: check-run-597c5002e426
      type: string
    - name: check-run-fa7347d12d41
      type: string
    - name: check-run-1f589d4f9dc0
      type: string
    - name: check-run-7a0612208705
      type: string
    - name: check-run-9b94606585d2
      type: string
    - name: check-run-06f17b989143
      type: string
    - name: check-run-d7821c2f8993
      type: string
    - name: check-run-88490e4492ce
      type: string
    - name: check-run-14a786f1c7c4
      type: string
    - name: check-run-7fd7abd3f376
      type: string
    - name: check-run-6ff80b84857c
      type: string
    - name: check-run-94126e72e0d9
      type: string
    - name: check-run-a35469fb81af
      type: string
    - name: check-run-80f6f9d3ce7a
      type: string
    - name: check-run-a6331c866db6
      type: string
    - name: check-run-77a5e1e81751
      type: string
    - name: check-run-e250f0bdbe76
      type: string
    - name: check-run-371e9eca6d22
      type: string
    - name: check-run-1ef259857ac2
      type: string
    - name: check-run-1332da5de394
      type: string
    - name: check-run-fe7a4dc28022
      type: string
    - name: check-run-c989afe66204
      type: string
    - name: check-run-2223e4e14bc7
      type: string
    - name: check-run-1292575c9224
      type: string
    - name: check-run-608ec057c101
      type: string
    - name: check-run-8d8e4887cf11
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  steps:
    - computeResources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: git-provider-token
              name: "{{ git_auth_secret }}"
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: pending
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def gh [method: string, path: string, body?: record]: nothing -> any {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)($path)"
          let headers = [
            Authorization $"Bearer ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
          match $method {
            "POST" => { http post $url $body -t application/json -H $headers }
            "PATCH" => { http patch $url $body -t application/json -H $headers }
            _ => { http get $url -H $headers }
          }
        }

        def now-iso []: nothing -> string { date now | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ' }

        def param-id [value: string]: nothing -> any { if ($value | str trim) =~ '^\d+$' { $value | str trim } else { null } }

        let runs = [
          { context: "gofmt-check", result: "$(results.check-run-597c5002e426.path)" }
          { context: "go-lint", result: "$(results.check-run-fa7347d12d41.path)" }
          { context: "go-build", result: "$(results.check-run-1f589d4f9dc0.path)" }
          { context: "go-test", result: "$(results.check-run-7a0612208705.path)" }
          { context: "openapi-verify", result: "$(results.check-run-9b94606585d2.path)" }
          { context: "eslint-lint-web", result: "$(results.check-run-06f17b989143.path)" }
          { context: "codegen-check", result: "$(results.check-run-d7821c2f8993.path)" }
          { context: "go-integration-test", result: "$(results.check-run-88490e4492ce.path)" }
          { context: "govulncheck-scan", result: "$(results.check-run-14a786f1c7c4.path)" }
          { context: "grype-vuln-web", result: "$(results.check-run-7fd7abd3f376.path)" }
          { context: "gitleaks-secrets", result: "$(results.check-run-6ff80b84857c.path)" }
          { context: "semgrep-sast", result: "$(results.check-run-94126e72e0d9.path)" }
          { context: "image-build-api", result: "$(results.check-run-a35469fb81af.path)" }
          { context: "image-build-scanner-worker", result: "$(results.check-run-80f6f9d3ce7a.path)" }
          { context: "image-build-oci-metadata-worker", result: "$(results.check-run-a6331c866db6.path)" }
          { context: "image-build-git-worker", result: "$(results.check-run-77a5e1e81751.path)" }
          { context: "image-build-user-enricher-worker", result: "$(results.check-run-e250f0bdbe76.path)" }
          { context: "image-build-provenance-worker", result: "$(results.check-run-371e9eca6d22.path)" }
          { context: "image-build-vuln-worker", result: "$(results.check-run-1ef259857ac2.path)" }
          { context: "image-build-web", result: "$(results.check-run-1332da5de394.path)" }
          { context: "image-build-k8s-agent", result: "$(results.check-run-fe7a4dc28022.path)" }
          { context: "image-build-operator", result: "$(results.check-run-c989afe66204.path)" }
          { context: "image-build-cli", result: "$(results.check-run-2223e4e14bc7.path)" }
          { context: "helm-check", result: "$(results.check-run-1292575c9224.path)" }
          { context: "helm-publish", result: "$(results.check-run-608ec057c101.path)" }
          { context: "sbom-push", result: "$(results.check-run-8d8e4887cf11.path)" }
        ]

        # Write every result before calling GitHub: a reporting task whose param names a result the
        # pending task never wrote fails, and a GitHub outage must not take the pipeline with it.
        for run in $runs { "none" | save -f $run.result }

        let failed = $runs | each { |run|
          let label = $"check-pending [($run.context)]"
          try {
            let id = (gh POST "/check-runs" ({ name: $run.context, head_sha: "$(params.revision)", status: "queued" } | merge { details_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/pipelineruns/$(params.pipeline-run-name)" }) | get id | into string)
            $id | save -f $run.result
            log $"($label): created check run ($id)"
            null
          } catch { |e|
            log $"($label): error: ($e.msg)"
            $run.context
          }
        } | compact

        if ($failed | is-not-empty) {
          log $"check-pending: ($failed | length) failed: ($failed | str join ', ')"
          exit 1
        }
