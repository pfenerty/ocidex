apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-set-status-pending-ocidex-push
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  steps:
    - computeResources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: pending
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def post-status [label: string, body: record]: nothing -> bool {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
          log $"($label): POST ($url)"
          log $"($label): body: ($body | to json -r)"
          try {
            http post $url $body -t application/json -H [
              Authorization $"token ($env.GITHUB_TOKEN)"
              Accept "application/vnd.github+json"
            ]
            log $"($label): done"
            true
          } catch { |e|
            log $"($label): error: ($e.msg)"
            false
          }
        }

        let contexts = ["gofmt-check" "go-test" "go-build" "openapi-verify" "eslint-lint-web" "go-integration-test" "govulncheck-scan" "grype-vuln-web" "gitleaks-secrets" "semgrep-sast" "image-build-api" "image-build-scanner-worker" "image-build-oci-metadata-worker" "image-build-git-worker" "image-build-user-enricher-worker" "image-build-provenance-worker" "image-build-vuln-worker" "image-build-web" "image-build-k8s-agent" "image-build-operator" "image-build-cli" "helm-check" "helm-publish" "sbom-push"]

        let failed = $contexts | each { |context|
          let body = { state: "pending", context: $context, description: "Running" }
          if (post-status $"status-pending [($context)]" $body) { null } else { $context }
        } | compact

        if ($failed | is-not-empty) {
          log $"status-pending: ($failed | length) failed: ($failed | str join ', ')"
          exit 1
        }
