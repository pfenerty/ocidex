apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-openapi-verify
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    env:
      - name: GOPATH
        value: $(workspaces.workspace.path)/.go-path
      - name: GOMODCACHE
        value: $(workspaces.workspace.path)/.go-mod
      - name: GOCACHE
        value: $(workspaces.workspace.path)/.go-build
      - name: GIT_CONFIG_GLOBAL
        value: $(workspaces.workspace.path)/.gitconfig
      - name: HOME
        value: /tmp
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: restore-node-modules-cache
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (
          ["package-lock.json"]
          | each { |f| if ($f | path exists) { open --raw $f } else { "" } }
          | str join | hash sha256 | str substring 0..15
        )
        $hash | save -f /tekton/home/.cache-node-modules-hash
        if (["node_modules"] | any { |p| $p | path exists }) {
          log $"restore-node-modules-cache: paths already exist, skipping restore ($hash)"
          exit 0
        }
        let archive = $"$(workspaces.node-cache.path)/($hash).tar.zst"

        if ($archive | path exists) {
          let archive_size = (ls $archive | get size.0)
          log $"restore-node-modules-cache: hit ($hash) size=($archive_size)"
          let t0 = (date now)
          let stage = $".cache-restore-(random uuid)"
          mkdir $stage
          try {
            ^zstd -d -T1 -c $archive | ^tar xf - -C $stage -o --no-same-permissions
          } catch { |e|
            rm -rf $stage
            log $"restore-node-modules-cache: extract failed \(($e.msg)\)"
            exit 1
          }
          for p in ["node_modules"] {
            let staged = ($stage | path join $p)
            if not ($staged | path exists) { continue }
            if ($p | path exists) {
              # Rename the live tree aside and move the new one in — never delete in place. The
              # displaced tree is removed afterwards and best-effort: a concurrent writer still inside
              # it can legitimately make that fail, and by then nothing resolves to it by path.
              let displaced = $"($p).displaced-(random uuid)"
              mv $p $displaced
              mv $staged $p
              try { ^chmod -R u+w $displaced; rm -rf $displaced } catch { |e|
                log $"restore-node-modules-cache: displaced tree ($displaced) not removed: ($e.msg)"
              }
            } else {
              let parent = ($p | path dirname)
              if (($parent | str length) > 0) and ($parent != ".") { mkdir $parent }
              mv $staged $p
            }
          }
          rm -rf $stage
          let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
          log $"restore-node-modules-cache: restored in ($elapsed)s"
        } else {
          log $"restore-node-modules-cache: miss ($hash)"
        }
      workingDir: $(workspaces.workspace.path)/web
    - image: ghcr.io/pfenerty/apko-cicd/golang:1.27
      name: openapi-spec-check
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        log $"go=(go version) uid=(id -u) pwd=(pwd)"
        ^git config --global --add safe.directory (pwd)
        log "Generating OpenAPI spec"
        ^go run ./cmd/specgen out> /tmp/openapi-check.json
        log "Diffing against committed spec"
        ^diff web/openapi.json /tmp/openapi-check.json
        log "OK: spec is up to date"
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [openapi-verify/openapi-spec-check]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - computeResources:
        limits:
          cpu: "2"
          memory: 3Gi
        requests:
          cpu: 100m
          memory: 2Gi
      image: ghcr.io/pfenerty/apko-cicd/nodejs:24
      name: openapi-types-check
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        log $"node=(node --version) npm=(npm --version) uid=(id -u)"
        log "Installing dependencies (npm ci)"
        ^npm ci
        log "Generating TypeScript types from spec"
        ^npx openapi-typescript openapi.json -o /tmp/openapi-check.d.ts
        log "Diffing against committed types"
        ^diff src/types/openapi.d.ts /tmp/openapi-check.d.ts
        log "OK: types up to date"
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [openapi-verify/openapi-types-check]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
      workingDir: $(workspaces.workspace.path)/web
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: save-node-modules-cache
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (try { open --raw /tekton/home/.cache-node-modules-hash | str trim } catch { "" })
        if ($hash | is-empty) { log "save-node-modules-cache: no hash, skipping"; exit 0 }

        let archive = $"$(workspaces.node-cache.path)/($hash).tar.zst"
        if ($archive | path exists) { log $"save-node-modules-cache: ($hash) exists, skipping"; exit 0 }

        let paths = ["node_modules"] | where { |p| ($p | path exists) }
        if ($paths | is-empty) { log "save-node-modules-cache: no paths to cache"; exit 0 }

        for p in $paths { ^chmod -R u+w $p }

        let max = 3
        if $max > 0 {
          let entries = (try { ls $(workspaces.node-cache.path)/*.tar.zst | sort-by modified | reverse | skip $max } catch { [] })
          for e in $entries { log $"save-node-modules-cache: evicting ($e.name | path basename)"; rm $e.name }
        }

        let uncompressed = ($paths | each { |p| try { du $p | get apparent.0 | into int } catch { 0 } } | math sum)
        log $"save-node-modules-cache: compressing (($uncompressed / 1_000_000) | math round --precision 1)MB uncompressed ..."
        let t0 = (date now)
        # Write to a temp path and rename into place: a step killed mid-write (OOM, eviction,
        # timeout) must never leave a truncated archive at the real hash-keyed path, since the
        # skip-if-exists guard above means a corrupt archive there would never self-heal.
        let tmp = $"($archive).tmp.(random uuid)"
        # nushell aborts the enclosing block as soon as any external command in the pipe
        # reports a non-zero exit (e.g. tar failing to read one of $paths), so cleanup must
        # live in a catch — code placed after the pipe but outside try/catch never runs.
        try {
          ^tar cf - ...$paths | ^zstd -1 -T1 -o $tmp
        } catch { |e|
          rm -f $tmp
          log $"save-node-modules-cache: compress failed (($e.msg)), discarding partial archive"
          exit 1
        }
        mv -f $tmp $archive
        let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
        let compressed = (ls $archive | get size.0)
        let ratio = ($uncompressed / ($compressed | into int) | math round --precision 1)
        log $"save-node-modules-cache: saved ($compressed) ratio=($ratio)x in ($elapsed)s"
      workingDir: $(workspaces.workspace.path)/web
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = ([{ name: "openapi-spec-check", path: "/tekton/steps/step-openapi-spec-check/exitCode" } { name: "openapi-types-check", path: "/tekton/steps/step-openapi-types-check/exitCode" }] | each { |s| { name: $s.name, code: (try { open --raw $s.path | str trim | into int } catch { 0 }) } })
        let exit_code = ([$contract_code ...($step_codes | each { |s| $s.code })] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        # Name the first step that failed, so the check says where without opening the logs.
        let failed_steps = ($step_codes | where code != 0)
        let desc = if $exit_code == 0 {
          "Passed"
        } else if ($failed_steps | is-empty) {
          $"Failed: exit ($exit_code)"
        } else {
          let first = ($failed_steps | first)
          $"Failed: step ($first.name) exited ($first.code)"
        }

        log $"report-status [openapi-verify]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "openapi-verify", description: $desc }

        log $"report-status [openapi-verify]: POST ($url)"
        log $"report-status [openapi-verify]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [openapi-verify]: done"
        } catch { |e|
          log $"report-status [openapi-verify]: error: ($e.msg)"
        }
        exit $exit_code
  workspaces:
    - name: node-cache
    - name: workspace
