apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-openapi-breaking
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
    - name: pipeline-run-name
      type: string
    - name: check-run-id
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - computeResources:
        requests:
          cpu: 10m
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: git-provider-token
              name: "{{ git_auth_secret }}"
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-running
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def gh [method: string, path: string, body?: record]: nothing -> any {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)($path)"
          let headers = [
            Authorization $"Bearer ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
          match $method {
            "POST" => { http post $url $body -t application/json -H $headers }
            "PATCH" => { http patch $url $body -t application/json -H $headers }
            _ => { http get $url -H $headers }
          }
        }

        def now-iso []: nothing -> string { date now | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ' }

        def param-id [value: string]: nothing -> any { if ($value | str trim) =~ '^\d+$' { $value | str trim } else { null } }

        try { date now | format date '%s' | save -f /tekton/home/.status-started-at } catch { |e| log $"check-running: cannot record start time: ($e.msg)" }

        let id = (param-id "$(params.check-run-id)")
        let body = ({ status: "in_progress", started_at: (now-iso) } | merge { details_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/taskruns/$(context.taskRun.name)" })
        let id = if $id != null {
          try { gh PATCH $"/check-runs/($id)" $body | ignore; log $"("check-running [openapi-breaking]"): check run ($id) in progress" } catch { |e| log $"("check-running [openapi-breaking]"): error: ($e.msg)" }
          $id
        } else {
          # The pending task could not create the run; create it here instead.
          try {
            let id = (gh POST "/check-runs" ($body | merge { name: "openapi-breaking", head_sha: "$(params.revision)" }) | get id | into string)
            log $"("check-running [openapi-breaking]"): created check run ($id)"
            $id
          } catch { |e| log $"("check-running [openapi-breaking]"): error: ($e.msg)"; null }
        }
        if $id != null { $id | save -f /tekton/home/.check-run-id }
    - computeResources:
        limits:
          cpu: "1"
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
      image: docker.io/tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c
      name: oasdiff-breaking
      onError: continue
      script: |-
        #!/bin/sh
        log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }
        [ -e /tekton/home/.exit-code ] || printf '%s' 0 > /tekton/home/.exit-code
        chmod 0666 /tekton/home/.exit-code 2>/dev/null || true
        __tek_body() (
        # Fail the PR when web/openapi.json breaks the /api/v1 contract of the last release
        # (ADR-052, docs/API_VERSIONING.md). Breaks listed in web/openapi-breaking-accepted.txt
        # are accepted; that file is the reviewed override.
        set -e

        # The workspace is owned by another uid, and git-clone fetched only the PR's target
        # branch, so release tags have to be fetched here.
        g() { git -c safe.directory='*' "$@"; }
        g fetch -q --no-tags origin 'refs/tags/v*:refs/tags/v*'

        # Newest release by version, prereleases sorting before their release. Not `git
        # describe`: v0.0.1-rc.1..v0.0.2 are not ancestors of main (ocidex-tkn9.8).
        TAG=$(g -c versionsort.suffix=- tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)
        if [ -z "$TAG" ]; then
          echo "no release tag yet; nothing to compare against"
          exit 0
        fi

        g show "$TAG:web/openapi.json" > /tmp/openapi-base.json
        echo "comparing web/openapi.json against $TAG"
        oasdiff breaking /tmp/openapi-base.json web/openapi.json \
          --fail-on ERR \
          --err-ignore web/openapi-breaking-accepted.txt
        echo "OK: no unaccepted breaking changes against $TAG"
        )
        if command -v tee >/dev/null 2>&1; then
          : > /tekton/home/.step-output-oasdiff-breaking 2>/dev/null; chmod 0666 /tekton/home/.step-output-oasdiff-breaking 2>/dev/null || true
          exec 3>&1
          __tek_rc=$( { { __tek_body 3>&- 4>&- 2>&1; echo $? >&4; } | tee /tekton/home/.step-output-oasdiff-breaking >&3; } 4>&1 )
          exec 3>&-
          if [ "$(wc -c < /tekton/home/.step-output-oasdiff-breaking 2>/dev/null || echo 0)" -gt 60000 ]; then
            tail -c 60000 /tekton/home/.step-output-oasdiff-breaking > /tekton/home/.step-output-oasdiff-breaking.tmp && cat /tekton/home/.step-output-oasdiff-breaking.tmp > /tekton/home/.step-output-oasdiff-breaking; rm -f /tekton/home/.step-output-oasdiff-breaking.tmp
          fi
        else
          __tek_body
          __tek_rc=$?
        fi
        if [ "$__tek_rc" -ne 0 ]; then log "error [openapi-breaking/oasdiff-breaking]: exited with status $__tek_rc"; fi
        __tek_prev=$(cat /tekton/home/.exit-code 2>/dev/null || echo 0)
        if [ "$__tek_rc" -gt "$__tek_prev" ]; then __tek_prev="$__tek_rc"; fi
        printf '%s' "$__tek_prev" > /tekton/home/.exit-code
        exit "$__tek_rc"
      workingDir: $(workspaces.workspace.path)
    - computeResources:
        requests:
          cpu: 10m
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: git-provider-token
              name: "{{ git_auth_secret }}"
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def gh [method: string, path: string, body?: record]: nothing -> any {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)($path)"
          let headers = [
            Authorization $"Bearer ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
          match $method {
            "POST" => { http post $url $body -t application/json -H $headers }
            "PATCH" => { http patch $url $body -t application/json -H $headers }
            _ => { http get $url -H $headers }
          }
        }

        def now-iso []: nothing -> string { date now | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ' }

        def param-id [value: string]: nothing -> any { if ($value | str trim) =~ '^\d+$' { $value | str trim } else { null } }

        def format-duration [secs: int]: nothing -> string {
          let secs = ([$secs 0] | math max)
          let h = $secs // 3600
          let m = ($secs mod 3600) // 60
          let s = $secs mod 60
          let pad = { |n| $n | into string | fill -a right -w 2 -c '0' }
          if $h > 0 {
            $"($h)h(do $pad $m)m"
          } else if $m > 0 {
            $"($m)m(do $pad $s)s"
          } else {
            $"($s)s"
          }
        }

        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        let step_codes = ([{ name: "oasdiff-breaking", path: "/tekton/steps/step-oasdiff-breaking/exitCode", out: "/tekton/home/.step-output-oasdiff-breaking" }] | each { |s|
          let ran = ($s.path | path exists)
          { name: $s.name, ran: $ran, out: $s.out, code: (if $ran { try { open --raw $s.path | str trim | into int } catch { 0 } } else { 0 }) }
        })
        let exit_code = ([$contract_code ...($step_codes | each { |s| $s.code })] | math max)
        let conclusion = if $exit_code == 0 { "success" } else { "failure" }
        let failed_steps = ($step_codes | where code != 0)
        let result = if $exit_code == 0 {
          "Passed"
        } else if ($failed_steps | is-empty) {
          $"Failed: exit ($exit_code)"
        } else {
          let first = ($failed_steps | first)
          $"Failed: step ($first.name) exited ($first.code)"
        }
        let duration = (try { format-duration ((date now | format date '%s' | into int) - (open --raw /tekton/home/.status-started-at | str trim | into int)) } catch { null })
        let title = if $duration == null { $result } else { $"($result) in ($duration)" }

        let rows = ($step_codes | each { |s|
          let st = if not $s.ran { "did not run" } else if $s.code == 0 { "passed" } else { $"exited ($s.code)" }
          $"| ($s.name) | ($st) |"
        })
        mut summary = (["| Step | Result |" "| --- | --- |" ...$rows] | str join "\n")
        let tail = if ($failed_steps | is-empty) { "" } else {
          try { open --raw ($failed_steps | first | get out) | into string | ansi strip | str trim -r } catch { "" }
        }
        if ($tail | is-not-empty) {
          $summary = ([$summary "" $"### Output of ($failed_steps | first | get name)" "" "~~~~text" $tail "~~~~"] | str join "\n")
        }
        let annotations = if ($tail | is-empty) { [] } else {
          $tail | lines | parse --regex "^(?<path>[\\w./@+-]+\\.[A-Za-z0-9]+):(?<line>\\d+)(?::(?<col>\\d+))?:\\s*(?<message>\\S.*)$" | first 50 | each { |m|
            let line = ($m.line | into int)
            { path: ($m.path | str replace -r '^\./' ''), start_line: $line, end_line: $line, annotation_level: "failure", message: ($m.message | str trim) }
          }
        }

        let output = ({ title: $title, summary: $summary } | merge (if ($annotations | is-empty) { {} } else { { annotations: $annotations } }))
        let body = ({ status: "completed", conclusion: $conclusion, completed_at: (now-iso), output: $output } | merge { details_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/taskruns/$(context.taskRun.name)" })
        let id = (try { open --raw /tekton/home/.check-run-id | str trim } catch { param-id "$(params.check-run-id)" })
        log $"("report-status [openapi-breaking]"): exit-code=($exit_code) conclusion=($conclusion)"
        try {
          if $id != null {
            gh PATCH $"/check-runs/($id)" $body | ignore
          } else {
            gh POST "/check-runs" ($body | merge { name: "openapi-breaking", head_sha: "$(params.revision)" }) | ignore
          }
          log $"("report-status [openapi-breaking]"): done"
        } catch { |e|
          log $"("report-status [openapi-breaking]"): error: ($e.msg)"
        }
        exit $exit_code
  workspaces:
    - name: workspace
