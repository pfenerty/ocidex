apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-reconcile-status-ocidex-push
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
    - name: status-gofmt-check
      type: string
    - name: status-go-test
      type: string
    - name: status-go-build
      type: string
    - name: status-openapi-verify
      type: string
    - name: status-eslint-lint-web
      type: string
    - name: status-go-integration-test
      type: string
    - name: status-govulncheck-scan
      type: string
    - name: status-grype-vuln-web
      type: string
    - name: status-gitleaks-secrets
      type: string
    - name: status-semgrep-sast
      type: string
    - name: status-image-build-api
      type: string
    - name: status-image-build-scanner-worker
      type: string
    - name: status-image-build-oci-metadata-worker
      type: string
    - name: status-image-build-git-worker
      type: string
    - name: status-image-build-user-enricher-worker
      type: string
    - name: status-image-build-provenance-worker
      type: string
    - name: status-image-build-vuln-worker
      type: string
    - name: status-image-build-web
      type: string
    - name: status-image-build-k8s-agent
      type: string
    - name: status-image-build-operator
      type: string
    - name: status-image-build-cli
      type: string
    - name: status-helm-check
      type: string
    - name: status-helm-publish
      type: string
    - name: status-sbom-push
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  steps:
    - computeResources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: reconcile
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def post-status [label: string, body: record]: nothing -> bool {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
          log $"($label): POST ($url)"
          log $"($label): body: ($body | to json -r)"
          try {
            http post $url $body -t application/json -H [
              Authorization $"token ($env.GITHUB_TOKEN)"
              Accept "application/vnd.github+json"
            ]
            log $"($label): done"
            true
          } catch { |e|
            log $"($label): error: ($e.msg)"
            false
          }
        }

        let entries = [
          { status: "$(params.status-gofmt-check)", context: "gofmt-check" }
          { status: "$(params.status-go-test)", context: "go-test" }
          { status: "$(params.status-go-build)", context: "go-build" }
          { status: "$(params.status-openapi-verify)", context: "openapi-verify" }
          { status: "$(params.status-eslint-lint-web)", context: "eslint-lint-web" }
          { status: "$(params.status-go-integration-test)", context: "go-integration-test" }
          { status: "$(params.status-govulncheck-scan)", context: "govulncheck-scan" }
          { status: "$(params.status-grype-vuln-web)", context: "grype-vuln-web" }
          { status: "$(params.status-gitleaks-secrets)", context: "gitleaks-secrets" }
          { status: "$(params.status-semgrep-sast)", context: "semgrep-sast" }
          { status: "$(params.status-image-build-api)", context: "image-build-api" }
          { status: "$(params.status-image-build-scanner-worker)", context: "image-build-scanner-worker" }
          { status: "$(params.status-image-build-oci-metadata-worker)", context: "image-build-oci-metadata-worker" }
          { status: "$(params.status-image-build-git-worker)", context: "image-build-git-worker" }
          { status: "$(params.status-image-build-user-enricher-worker)", context: "image-build-user-enricher-worker" }
          { status: "$(params.status-image-build-provenance-worker)", context: "image-build-provenance-worker" }
          { status: "$(params.status-image-build-vuln-worker)", context: "image-build-vuln-worker" }
          { status: "$(params.status-image-build-web)", context: "image-build-web" }
          { status: "$(params.status-image-build-k8s-agent)", context: "image-build-k8s-agent" }
          { status: "$(params.status-image-build-operator)", context: "image-build-operator" }
          { status: "$(params.status-image-build-cli)", context: "image-build-cli" }
          { status: "$(params.status-helm-check)", context: "helm-check" }
          { status: "$(params.status-helm-publish)", context: "helm-publish" }
          { status: "$(params.status-sbom-push)", context: "sbom-push" }
        ]

        let failed = $entries | each { |entry|
          let label = $"reconcile-status [($entry.context)]"
          if $entry.status not-in ["None" "Failed"] {
            log $"($label): task status is ($entry.status), nothing to resolve"
            null
          } else {
            let state = if $entry.status == "None" { "success" } else { "failure" }
            let desc = if $entry.status == "None" { "Skipped" } else { "Failed or terminated" }
            log $"($label): task status is ($entry.status)"
            let body = { state: $state, context: $entry.context, description: $desc }
            if (post-status $label $body) { null } else { $entry.context }
          }
        } | compact

        if ($failed | is-not-empty) {
          log $"reconcile-status: ($failed | length) failed: ($failed | str join ', ')"
          exit 1
        }
