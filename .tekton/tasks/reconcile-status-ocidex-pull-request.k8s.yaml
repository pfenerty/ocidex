apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-reconcile-status-ocidex-pull-request
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
    - name: status-gofmt-check
      type: string
    - name: status-go-test
      type: string
    - name: status-go-build
      type: string
    - name: status-go-integration-test
      type: string
    - name: status-openapi-verify
      type: string
    - name: status-eslint-lint-web
      type: string
    - name: status-tekton-check
      type: string
    - name: status-helm-check
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  steps:
    - computeResources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: resolve-gofmt-check
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let status = "$(params.status-gofmt-check)"

        if $status not-in ["None" "Failed"] {
          log $"reconcile-status [gofmt-check]: task status is ($status), nothing to resolve"
          exit 0
        }

        let state = if $status == "None" { "success" } else { "failure" }
        let desc = if $status == "None" { "Skipped" } else { "Failed or terminated" }

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "gofmt-check", description: $desc }

        log $"reconcile-status [gofmt-check]: task status is ($status), POST ($url)"
        log $"reconcile-status [gofmt-check]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "reconcile-status [gofmt-check]: done"
        } catch { |e|
          log $"reconcile-status [gofmt-check]: error: ($e.msg)"
          exit 1
        }
    - computeResources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: resolve-go-test
      onError: continue
      script: |-
