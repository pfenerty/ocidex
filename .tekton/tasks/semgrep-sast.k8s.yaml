apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-semgrep-sast
  namespace: ocidex-ci
spec:
  params:
    - name: source-branch
      type: string
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - computeResources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: 500m
          memory: 1Gi
      env:
        - name: HOME
          value: /tmp
      image: ghcr.io/pfenerty/apko-cicd/semgrep:1.165.0
      name: semgrep-scan
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        ^git config --global --add safe.directory '*'
        let pac_event = ($env.PAC_EVENT_TYPE? | default "")
        let pac_target = ($env.PAC_TARGET_BRANCH? | default "")
        mut scoped = false
        if $pac_event == "pull_request" and ($pac_target | is-not-empty) {
          let fetched = (do { ^git -c safe.directory='*' fetch --quiet origin $pac_target } | complete)
          if $fetched.exit_code == 0 { $scoped = true }
        }
        let baseline = if $scoped {
          ^git -c safe.directory='*' update-ref refs/semgrep-baseline FETCH_HEAD
          ["--baseline-commit" "refs/semgrep-baseline"]
        } else { [] }
        # Exclude the CI cache dirs goEnv creates in the workspace root (GOMODCACHE=.go-mod etc.):
        # they hold tens of thousands of third-party .go files that semgrep would otherwise SAST-scan
        # as if they were our source (66k+ files). .gitignore covers node_modules but not these.
        # The scan runs under sh via memoryWatchdog, so $baseline crosses over as positional args.
        let watchdog = r#'
        semgrep scan --error --disable-version-check --metrics off --jobs 1 --max-memory 2048 --severity ERROR --config p/golang --config p/typescript --config p/secrets --exclude .go-mod --exclude .go-build --exclude .go-path --sarif-output=semgrep.sarif "$@" . &
        pid=$!
        max_file=/sys/fs/cgroup/memory.max
        cur_file=/sys/fs/cgroup/memory.current
        [ -f "$max_file" ] || max_file=/sys/fs/cgroup/memory/memory.limit_in_bytes
        [ -f "$cur_file" ] || cur_file=/sys/fs/cgroup/memory/memory.usage_in_bytes
        mem_max=$(cat "$max_file" 2>/dev/null || echo 0)
        if [ "$mem_max" != "max" ] && [ "$mem_max" -gt 0 ] 2>/dev/null; then
          threshold=$((mem_max * 92 / 100))
          while kill -0 "$pid" 2>/dev/null; do
            cur=$(cat "$cur_file" 2>/dev/null || echo 0)
            if [ "$cur" -gt "$threshold" ] 2>/dev/null; then
              echo "semgrep: usage $cur bytes exceeded 92% of cgroup limit $mem_max - self-terminating before kernel OOM-kill" >&2
              kill -TERM "$pid" 2>/dev/null
              sleep 2
              kill -KILL "$pid" 2>/dev/null
              wait "$pid" 2>/dev/null
              exit 99
            fi
            sleep 1
          done
        fi
        wait "$pid"
        '#
        ^sh -c $watchdog semgrep ...$baseline
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [semgrep-sast/semgrep-scan]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: sarif-upload-semgrep
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def main [] {
        print "upload-sarif [semgrep]: start"

        if not ("semgrep.sarif" | path exists) or (ls "semgrep.sarif" | get size.0) == 0B {
          print "upload-sarif [semgrep]: no sarif produced, skipping"
          return
        }

        # code-scanning wants a full ref; PAC's source-branch is the short name on push, a ref on tag.
        let ref_raw = "$(params.source-branch)"
        let ref = if ($ref_raw | str starts-with "refs/") { $ref_raw } else { $"refs/heads/($ref_raw)" }
        print $"upload-sarif [semgrep]: ref=($ref)"

        # GitHub has no top-level category field (passing one returns 422). The category lives
        # INSIDE the SARIF as runs[].automationDetails.id, which is also how GitHub keeps analyses
        # distinct — essential here since grype-go and grype-web share the tool name grype and
        # would otherwise overwrite each other on the same ref.
        let sarif_json = (open --raw "semgrep.sarif" | from json)
        let ad = { id: "semgrep/" }
        let runs2 = ($sarif_json.runs | each { |r| $r | upsert automationDetails $ad })
        let sarif_b64 = ($sarif_json | upsert runs $runs2 | to json -r | ^gzip -c | encode base64)
        let url = "https://api.github.com/repos/$(params.repo-full-name)/code-scanning/sarifs"
        let body = { commit_sha: "$(params.revision)", ref: $ref, sarif: $sarif_b64 }

        # --allow-errors + --full so a non-2xx (e.g. 403 missing security_events scope, 422 ref
        # mismatch) is captured and logged instead of thrown — the status/body tells us exactly why.
        # Wrapped in try only to survive genuine network errors. Note: interpolated strings must not
        # contain bare parentheses (nushell evaluates them), so keep log text paren-free.
        let resp = (try {
          http post $url $body -t application/json --full --allow-errors -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
        } catch { |e| print $"upload-sarif [semgrep]: request error - ($e.msg)"; null })

        if $resp != null {
          let status = ($resp.status? | default 0)
          if $status >= 200 and $status < 300 {
            print $"upload-sarif [semgrep]: uploaded ok, status ($status)"
          } else {
            print $"upload-sarif [semgrep]: upload failed, status ($status)"
            print ($resp.body? | default "" | to text)
          }
        }
        }

        # Never affect the task's scan verdict: a malformed SARIF, a missing gzip, or any other raise
        # inside main is logged and swallowed here rather than becoming the step's exit code.
        try { main } catch { |e| print $"upload-sarif [semgrep]: error - ($e.msg)" }
        exit 0
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = (["/tekton/steps/step-semgrep-scan/exitCode" "/tekton/steps/step-sarif-upload-semgrep/exitCode"] | each { |p| try { open --raw $p | str trim | into int } catch { 0 } })
        let exit_code = ([$contract_code ...$step_codes] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        let desc = if $exit_code == 0 { "Passed" } else { "Failed" }

        log $"report-status [semgrep-sast]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "semgrep-sast", description: $desc }

        log $"report-status [semgrep-sast]: POST ($url)"
        log $"report-status [semgrep-sast]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [semgrep-sast]: done"
        } catch { |e|
          log $"report-status [semgrep-sast]: error: ($e.msg)"
        }
  workspaces:
    - name: workspace
