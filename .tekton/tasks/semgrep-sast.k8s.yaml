apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-semgrep-sast
  namespace: ocidex-ci
spec:
  params:
    - description: Branch or tag ref of the event, bound by PAC from source_branch
      name: source-branch
      type: string
    - name: repo-full-name
      type: string
    - name: revision
      type: string
    - name: pipeline-run-name
      type: string
    - name: check-run-id
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - computeResources:
        requests:
          cpu: 10m
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: git-provider-token
              name: "{{ git_auth_secret }}"
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-running
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def gh [method: string, path: string, body?: record]: nothing -> any {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)($path)"
          let headers = [
            Authorization $"Bearer ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
          match $method {
            "POST" => { http post $url $body -t application/json -H $headers }
            "PATCH" => { http patch $url $body -t application/json -H $headers }
            _ => { http get $url -H $headers }
          }
        }

        def now-iso []: nothing -> string { date now | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ' }

        def param-id [value: string]: nothing -> any { if ($value | str trim) =~ '^\d+$' { $value | str trim } else { null } }

        try { date now | format date '%s' | save -f /tekton/home/.status-started-at } catch { |e| log $"check-running: cannot record start time: ($e.msg)" }

        let id = (param-id "$(params.check-run-id)")
        let body = ({ status: "in_progress", started_at: (now-iso) } | merge { details_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/taskruns/$(context.taskRun.name)" })
        let id = if $id != null {
          try { gh PATCH $"/check-runs/($id)" $body | ignore; log $"("check-running [semgrep-sast]"): check run ($id) in progress" } catch { |e| log $"("check-running [semgrep-sast]"): error: ($e.msg)" }
          $id
        } else {
          # The pending task could not create the run; create it here instead.
          try {
            let id = (gh POST "/check-runs" ($body | merge { name: "semgrep-sast", head_sha: "$(params.revision)" }) | get id | into string)
            log $"("check-running [semgrep-sast]"): created check run ($id)"
            $id
          } catch { |e| log $"("check-running [semgrep-sast]"): error: ($e.msg)"; null }
        }
        if $id != null { $id | save -f /tekton/home/.check-run-id }
    - computeResources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: 500m
          memory: 1Gi
      env:
        - name: HOME
          value: /tmp
      image: ghcr.io/pfenerty/apko-cicd/semgrep:1.165.0
      name: semgrep-scan
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        ^git config --global --add safe.directory '*'
        let pac_event = ($env.PAC_EVENT_TYPE? | default "")
        let pac_target = ($env.PAC_TARGET_BRANCH? | default "")
        mut scoped = false
        if $pac_event == "pull_request" and ($pac_target | is-not-empty) {
          let fetched = (do { ^git -c safe.directory='*' fetch --quiet origin $pac_target } | complete)
          if $fetched.exit_code == 0 { $scoped = true }
        }
        $env.SEMGREP_BASELINE = if $scoped {
          ^git -c safe.directory='*' update-ref refs/semgrep-baseline FETCH_HEAD
          "refs/semgrep-baseline"
        } else { "" }
        # Exclude the CI cache dirs goEnv creates in the workspace root (GOMODCACHE=.go-mod etc.):
        # they hold tens of thousands of third-party .go files that semgrep would otherwise SAST-scan
        # as if they were our source (66k+ files). .gitignore covers node_modules but not these.
        # The scan runs under sh via memoryWatchdog, so the baseline crosses over as SEMGREP_BASELINE.
        ^sh -c r#'semgrep scan --error --disable-version-check --metrics off --jobs 1 --max-memory 2048 --severity ERROR --config p/golang --config p/typescript --config p/secrets --exclude .go-mod --exclude .go-build --exclude .go-path --sarif-output=semgrep.sarif ${SEMGREP_BASELINE:+--baseline-commit "$SEMGREP_BASELINE"} . &
        pid=$!
        max_file=/sys/fs/cgroup/memory.max
        cur_file=/sys/fs/cgroup/memory.current
        [ -f "$max_file" ] || max_file=/sys/fs/cgroup/memory/memory.limit_in_bytes
        [ -f "$cur_file" ] || cur_file=/sys/fs/cgroup/memory/memory.usage_in_bytes
        stat_file=/sys/fs/cgroup/memory.stat
        mem_max=$(cat "$max_file" 2>/dev/null || echo 0)
        peak=0
        if [ "$mem_max" != "max" ] && [ "$mem_max" -gt 0 ] 2>/dev/null; then
          threshold=$((mem_max * 92 / 100))
          while kill -0 "$pid" 2>/dev/null; do
            cur=$(cat "$cur_file" 2>/dev/null || echo 0)
            # Working set, as kubelet counts it: memory.current less reclaimable inactive page cache,
            # which builds up when one step runs the tool many times and is freed before any OOM-kill.
            inactive=$(awk '$1 == "inactive_file" { print $2 }' "$stat_file" 2>/dev/null)
            [ -n "$inactive" ] && cur=$((cur - inactive))
            [ "$cur" -gt "$peak" ] 2>/dev/null && peak=$cur
            if [ "$cur" -gt "$threshold" ] 2>/dev/null; then
              echo "semgrep: usage $cur bytes exceeded 92% of cgroup limit $mem_max - self-terminating before kernel OOM-kill" >&2
              kill -TERM "$pid" 2>/dev/null
              sleep 2
              kill -KILL "$pid" 2>/dev/null
              wait "$pid" 2>/dev/null
              exit 99
            fi
            sleep 1
          done
        fi
        wait "$pid"
        rc=$?
        [ "$peak" -gt 0 ] && echo "semgrep: peak working set $peak bytes of cgroup limit $mem_max" >&2
        exit $rc'# sh
        }
        if ($env.TEKTONIC_OUTPUT_CAPTURED? | is-empty) {
          try { "" | save -f /tekton/home/.step-output-semgrep-scan }
          try { ^chmod 0666 /tekton/home/.step-output-semgrep-scan }
          let rc = (with-env {TEKTONIC_OUTPUT_CAPTURED: "1"} { ^$nu.current-exe $env.CURRENT_FILE o+e>| tee { print -n -r } | tee { save -f /tekton/home/.step-output-semgrep-scan } | complete | get exit_code })
          try {
            let b = (open --raw /tekton/home/.step-output-semgrep-scan | into binary)
            if ($b | bytes length) > 60000 { $b | bytes at (-60000).. | save -f /tekton/home/.step-output-semgrep-scan }
          }
          exit $rc
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [semgrep-sast/semgrep-scan]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: sarif-upload-semgrep
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def main [] {
        print "upload-sarif [semgrep]: start"

        if not ("semgrep.sarif" | path exists) or (ls "semgrep.sarif" | get size.0) == 0B {
          print "upload-sarif [semgrep]: no sarif produced, skipping"
          return
        }

        # code-scanning wants a full ref; PAC's source-branch is the short name on push, a ref on tag.
        let ref_raw = "$(params.source-branch)"
        let ref = if ($ref_raw | str starts-with "refs/") { $ref_raw } else { $"refs/heads/($ref_raw)" }
        print $"upload-sarif [semgrep]: ref=($ref)"

        # GitHub has no top-level category field (passing one returns 422). The category lives
        # INSIDE the SARIF as runs[].automationDetails.id, which is also how GitHub keeps analyses
        # distinct — essential here since grype-go and grype-web share the tool name grype and
        # would otherwise overwrite each other on the same ref.
        let sarif_json = (open --raw "semgrep.sarif" | from json)
        let ad = { id: "semgrep/" }
        let runs2 = ($sarif_json.runs | each { |r| $r | upsert automationDetails $ad })
        let sarif_b64 = ($sarif_json | upsert runs $runs2 | to json -r | ^gzip -c | encode base64)
        let url = "https://api.github.com/repos/$(params.repo-full-name)/code-scanning/sarifs"
        let body = { commit_sha: "$(params.revision)", ref: $ref, sarif: $sarif_b64 }

        # --allow-errors + --full so a non-2xx (e.g. 403 missing security_events scope, 422 ref
        # mismatch) is captured and logged instead of thrown — the status/body tells us exactly why.
        # Wrapped in try only to survive genuine network errors. Note: interpolated strings must not
        # contain bare parentheses (nushell evaluates them), so keep log text paren-free.
        let resp = (try {
          http post $url $body -t application/json --full --allow-errors -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
        } catch { |e| print $"upload-sarif [semgrep]: request error - ($e.msg)"; null })

        if $resp != null {
          let status = ($resp.status? | default 0)
          if $status >= 200 and $status < 300 {
            print $"upload-sarif [semgrep]: uploaded ok, status ($status)"
          } else {
            print $"upload-sarif [semgrep]: upload failed, status ($status)"
            print ($resp.body? | default "" | to text)
          }
        }
        }

        # Never affect the task's scan verdict: a malformed SARIF, a missing gzip, or any other raise
        # inside main is logged and swallowed here rather than becoming the step's exit code.
        try { main } catch { |e| print $"upload-sarif [semgrep]: error - ($e.msg)" }
        exit 0
    - computeResources:
        requests:
          cpu: 10m
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: git-provider-token
              name: "{{ git_auth_secret }}"
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def gh [method: string, path: string, body?: record]: nothing -> any {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)($path)"
          let headers = [
            Authorization $"Bearer ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
          match $method {
            "POST" => { http post $url $body -t application/json -H $headers }
            "PATCH" => { http patch $url $body -t application/json -H $headers }
            _ => { http get $url -H $headers }
          }
        }

        def now-iso []: nothing -> string { date now | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ' }

        def param-id [value: string]: nothing -> any { if ($value | str trim) =~ '^\d+$' { $value | str trim } else { null } }

        def format-duration [secs: int]: nothing -> string {
          let secs = ([$secs 0] | math max)
          let h = $secs // 3600
          let m = ($secs mod 3600) // 60
          let s = $secs mod 60
          let pad = { |n| $n | into string | fill -a right -w 2 -c '0' }
          if $h > 0 {
            $"($h)h(do $pad $m)m"
          } else if $m > 0 {
            $"($m)m(do $pad $s)s"
          } else {
            $"($s)s"
          }
        }

        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        let step_codes = ([{ name: "semgrep-scan", path: "/tekton/steps/step-semgrep-scan/exitCode", out: "/tekton/home/.step-output-semgrep-scan" } { name: "sarif-upload-semgrep", path: "/tekton/steps/step-sarif-upload-semgrep/exitCode", out: "/tekton/home/.step-output-sarif-upload-semgrep" }] | each { |s|
          let ran = ($s.path | path exists)
          { name: $s.name, ran: $ran, out: $s.out, code: (if $ran { try { open --raw $s.path | str trim | into int } catch { 0 } } else { 0 }) }
        })
        let exit_code = ([$contract_code ...($step_codes | each { |s| $s.code })] | math max)
        let conclusion = if $exit_code == 0 { "success" } else { "failure" }
        let failed_steps = ($step_codes | where code != 0)
        let result = if $exit_code == 0 {
          "Passed"
        } else if ($failed_steps | is-empty) {
          $"Failed: exit ($exit_code)"
        } else {
          let first = ($failed_steps | first)
          $"Failed: step ($first.name) exited ($first.code)"
        }
        let duration = (try { format-duration ((date now | format date '%s' | into int) - (open --raw /tekton/home/.status-started-at | str trim | into int)) } catch { null })
        let title = if $duration == null { $result } else { $"($result) in ($duration)" }

        let rows = ($step_codes | each { |s|
          let st = if not $s.ran { "did not run" } else if $s.code == 0 { "passed" } else { $"exited ($s.code)" }
          $"| ($s.name) | ($st) |"
        })
        mut summary = (["| Step | Result |" "| --- | --- |" ...$rows] | str join "\n")
        let tail = if ($failed_steps | is-empty) { "" } else {
          try { open --raw ($failed_steps | first | get out) | into string | ansi strip | str trim -r } catch { "" }
        }
        if ($tail | is-not-empty) {
          $summary = ([$summary "" $"### Output of ($failed_steps | first | get name)" "" "~~~~text" $tail "~~~~"] | str join "\n")
        }
        let annotations = if ($tail | is-empty) { [] } else {
          $tail | lines | parse --regex "^(?<path>[\\w./@+-]+\\.[A-Za-z0-9]+):(?<line>\\d+)(?::(?<col>\\d+))?:\\s*(?<message>\\S.*)$" | first 50 | each { |m|
            let line = ($m.line | into int)
            { path: ($m.path | str replace -r '^\./' ''), start_line: $line, end_line: $line, annotation_level: "failure", message: ($m.message | str trim) }
          }
        }

        let output = ({ title: $title, summary: $summary } | merge (if ($annotations | is-empty) { {} } else { { annotations: $annotations } }))
        let body = ({ status: "completed", conclusion: $conclusion, completed_at: (now-iso), output: $output } | merge { details_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/taskruns/$(context.taskRun.name)" })
        let id = (try { open --raw /tekton/home/.check-run-id | str trim } catch { param-id "$(params.check-run-id)" })
        log $"("report-status [semgrep-sast]"): exit-code=($exit_code) conclusion=($conclusion)"
        try {
          if $id != null {
            gh PATCH $"/check-runs/($id)" $body | ignore
          } else {
            gh POST "/check-runs" ($body | merge { name: "semgrep-sast", head_sha: "$(params.revision)" }) | ignore
          }
          log $"("report-status [semgrep-sast]"): done"
        } catch { |e|
          log $"("report-status [semgrep-sast]"): error: ($e.msg)"
        }
  workspaces:
    - name: workspace
