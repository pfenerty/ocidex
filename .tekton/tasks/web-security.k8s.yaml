apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-web-security
  namespace: ocidex-ci
spec:
  params:
    - name: source-branch
      type: string
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - computeResources:
        limits:
          cpu: "1"
          memory: 512Mi
        requests:
          cpu: 200m
          memory: 256Mi
      image: ghcr.io/pfenerty/apko-cicd/syft:1.45.1
      name: sbom
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def main [] {
        print "syft: cataloging file:web/package-lock.json -> sbom-web.json"
        ^syft file:web/package-lock.json -o json=sbom-web.json
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - computeResources:
        limits:
          cpu: "1"
          memory: 512Mi
        requests:
          cpu: 200m
          memory: 256Mi
      image: ghcr.io/pfenerty/apko-cicd/grype:0.114.0
      name: scan
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def main [] {
        print "grype: scanning sbom-web.json (fail-on low); SARIF -> grype-web.sarif"
        ^grype sbom:sbom-web.json --fail-on low -o table -o sarif=grype-web.sarif
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: upload-sarif-grype-web
      onError: continue
      script: |-
        #!/usr/bin/env nu
        print "upload-sarif [grype-web]: start"

        if not ("grype-web.sarif" | path exists) or (ls "grype-web.sarif" | get size.0) == 0B {
          print "upload-sarif [grype-web]: no sarif produced, skipping"
          exit 0
        }

        # code-scanning wants a full ref; PAC's source-branch is the short name on push, a ref on tag.
        let ref_raw = "$(params.source-branch)"
        let ref = if ($ref_raw | str starts-with "refs/") { $ref_raw } else { $"refs/heads/($ref_raw)" }
        print $"upload-sarif [grype-web]: ref=($ref)"

        # GitHub has no top-level category field (passing one returns 422). The category lives
        # INSIDE the SARIF as runs[].automationDetails.id, which is also how GitHub keeps analyses
        # distinct — essential here since grype-go and grype-web share the tool name grype and
        # would otherwise overwrite each other on the same ref.
        let sarif_json = (open --raw "grype-web.sarif" | from json)
        let ad = { id: "grype-web/" }
        let runs2 = ($sarif_json.runs | each { |r| $r | upsert automationDetails $ad })
        let sarif_b64 = ($sarif_json | upsert runs $runs2 | to json -r | ^gzip -c | encode base64)
        let url = "https://api.github.com/repos/$(params.repo-full-name)/code-scanning/sarifs"
        let body = { commit_sha: "$(params.revision)", ref: $ref, sarif: $sarif_b64 }

        # --allow-errors + --full so a non-2xx (e.g. 403 missing security_events scope, 422 ref
        # mismatch) is captured and logged instead of thrown — the status/body tells us exactly why.
        # Wrapped in try only to survive genuine network errors. Note: interpolated strings must not
        # contain bare parentheses (nushell evaluates them), so keep log text paren-free.
        let resp = (try {
          http post $url $body -t application/json --full --allow-errors -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
        } catch { |e| print $"upload-sarif [grype-web]: request error - ($e.msg)"; null })

        if $resp != null {
          let status = ($resp.status? | default 0)
          if $status >= 200 and $status < 300 {
            print $"upload-sarif [grype-web]: uploaded ok, status ($status)"
          } else {
            print $"upload-sarif [grype-web]: upload failed, status ($status)"
            print ($resp.body? | default "" | to text)
          }
        }

        # Never affect the task's scan verdict.
        exit 0
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let exit_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        let state = if $exit_code == 0 { "success" } else { "failure" }
        let desc = if $exit_code == 0 { "Passed" } else { "Failed" }

        log $"report-status [web-security]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "web-security", description: $desc }

        log $"report-status [web-security]: POST ($url)"
        log $"report-status [web-security]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [web-security]: done"
        } catch { |e|
          log $"report-status [web-security]: error: ($e.msg)"
        }
  workspaces:
    - name: workspace
