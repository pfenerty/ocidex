apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-image-release-operator
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
    - name: pipeline-run-name
      type: string
    - name: check-run-id
      type: string
  results:
    - description: Fully-qualified reference of the operator image (Tekton Chains subject)
      name: operator-IMAGE_URL
      type: string
    - description: Digest (alg:hex) of the operator image (Tekton Chains subject)
      name: operator-IMAGE_DIGEST
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - computeResources:
        requests:
          cpu: 10m
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: git-provider-token
              name: "{{ git_auth_secret }}"
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-running
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def gh [method: string, path: string, body?: record]: nothing -> any {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)($path)"
          let headers = [
            Authorization $"Bearer ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
          match $method {
            "POST" => { http post $url $body -t application/json -H $headers }
            "PATCH" => { http patch $url $body -t application/json -H $headers }
            _ => { http get $url -H $headers }
          }
        }

        def now-iso []: nothing -> string { date now | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ' }

        def param-id [value: string]: nothing -> any { if ($value | str trim) =~ '^\d+$' { $value | str trim } else { null } }

        try { date now | format date '%s' | save -f /tekton/home/.status-started-at } catch { |e| log $"check-running: cannot record start time: ($e.msg)" }

        let id = (param-id "$(params.check-run-id)")
        let body = ({ status: "in_progress", started_at: (now-iso) } | merge { details_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/taskruns/$(context.taskRun.name)" })
        let id = if $id != null {
          try { gh PATCH $"/check-runs/($id)" $body | ignore; log $"("check-running [image-release-operator]"): check run ($id) in progress" } catch { |e| log $"("check-running [image-release-operator]"): error: ($e.msg)" }
          $id
        } else {
          # The pending task could not create the run; create it here instead.
          try {
            let id = (gh POST "/check-runs" ($body | merge { name: "image-release-operator", head_sha: "$(params.revision)" }) | get id | into string)
            log $"("check-running [image-release-operator]"): created check run ($id)"
            $id
          } catch { |e| log $"("check-running [image-release-operator]"): error: ($e.msg)"; null }
        }
        if $id != null { $id | save -f /tekton/home/.check-run-id }
    - computeResources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: prepare-buildkit-root
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        mkdir "$(workspaces.buildkit-release-cache.path)/root"
        ^chmod 0777 "$(workspaces.buildkit-release-cache.path)/root"
        '[worker.oci]
          gc = true

        [[worker.oci.gcpolicy]]
          keepBytes = 15032385536
          all = true
        ' | save --force "$(workspaces.buildkit-release-cache.path)/buildkitd.toml"
        # Size of the carried-over store, for tuning keepBytes against reality. Best-effort:
        # a missing du must not fail the build.
        try { ^du -sh "$(workspaces.buildkit-release-cache.path)/root" } catch { print "du unavailable" }
        }
        if ($env.TEKTONIC_OUTPUT_CAPTURED? | is-empty) {
          try { "" | save -f /tekton/home/.step-output-prepare-buildkit-root }
          try { ^chmod 0666 /tekton/home/.step-output-prepare-buildkit-root }
          let rc = (with-env {TEKTONIC_OUTPUT_CAPTURED: "1"} { ^$nu.current-exe $env.CURRENT_FILE o+e>| tee { print -n -r } | tee { save -f /tekton/home/.step-output-prepare-buildkit-root } | complete | get exit_code })
          try {
            let b = (open --raw /tekton/home/.step-output-prepare-buildkit-root | into binary)
            if ($b | bytes length) > 60000 { $b | bytes at (-60000).. | save -f /tekton/home/.step-output-prepare-buildkit-root }
          }
          exit $rc
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [image-release-operator/prepare-buildkit-root]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - computeResources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 25m
          memory: 64Mi
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: prepare-build-context
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        let rev = "$(params.revision)"
        let stamp = ".buildctx/.ctxrev"

        if ($stamp | path exists) and (open --raw $stamp | str trim) == $rev {
          log "build context already materialised for this revision"
        } else {
          rm --recursive --force ".buildctx"
          rm --force ".buildctx.tar"
          # Never pipe git archive into tar here: nushell coerces pipeline data to text and
          # corrupts the tar stream. Stage it as a file instead.
          #
          # -c safe.directory: the workspace PVC's contents are not owned by this step's uid, so
          # git's dubious-ownership guard refuses to operate on it. Passing the exemption on the
          # command line keeps it scoped to this one invocation — writing it into a config file
          # would need a writable GIT_CONFIG_GLOBAL that the other Go tasks already point elsewhere.
          ^git -c safe.directory='*' archive --format=tar --output ".buildctx.tar" $rev
          mkdir ".buildctx"
          ^tar -xf ".buildctx.tar" -C ".buildctx"
          rm --force ".buildctx.tar"
          $rev | save --force $stamp
          log "materialised clean build context"
        }

        # Written unconditionally, outside the guard above: the extraction is skipped for builds
        # 2..n of a chain, but the date file must still exist on a workspace that predates it.
        with-env {TZ: "UTC"} {
          let created = (^git -c safe.directory='*' show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ $rev | str trim)
          $created | save --force ".buildctx.date"
          log $"build-arg DATE pinned to commit time ($created)"
        }
        ^du -sh ".buildctx"
        }
        if ($env.TEKTONIC_OUTPUT_CAPTURED? | is-empty) {
          try { "" | save -f /tekton/home/.step-output-prepare-build-context }
          try { ^chmod 0666 /tekton/home/.step-output-prepare-build-context }
          let rc = (with-env {TEKTONIC_OUTPUT_CAPTURED: "1"} { ^$nu.current-exe $env.CURRENT_FILE o+e>| tee { print -n -r } | tee { save -f /tekton/home/.step-output-prepare-build-context } | complete | get exit_code })
          try {
            let b = (open --raw /tekton/home/.step-output-prepare-build-context | into binary)
            if ($b | bytes length) > 60000 { $b | bytes at (-60000).. | save -f /tekton/home/.step-output-prepare-build-context }
          }
          exit $rc
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [image-release-operator/prepare-build-context]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
      workingDir: $(workspaces.workspace.path)
    - computeResources:
        limits:
          cpu: "4"
          memory: 3Gi
        requests:
          cpu: 500m
          memory: 1Gi
      env:
        - name: DOCKER_CONFIG
          value: /tmp/docker-auth
        - name: BUILDKITD_FLAGS
          value: --oci-worker-snapshotter=native --oci-worker-no-process-sandbox --root $(workspaces.buildkit-release-cache.path)/root --config $(workspaces.buildkit-release-cache.path)/buildkitd.toml
        - name: BUILDCTL_CONNECT_RETRIES_MAX
          value: "60"
        - name: CHAINS_IMAGE_URL_PATH
          value: $(results.operator-IMAGE_URL.path)
        - name: CHAINS_IMAGE_DIGEST_PATH
          value: $(results.operator-IMAGE_DIGEST.path)
        - name: IMAGE
          value: ghcr.io/pfenerty/ocidex-operator
        - name: DOCKERFILE
          value: docker/Dockerfile
        - name: IMAGE_TITLE
          value: OCIDex Operator
        - name: IMAGE_DESCRIPTION
          value: Kubernetes operator for OCIDex CRDs
        - name: TARGET
          value: operator
      image: moby/buildkit:rootless
      name: build-and-push
      onError: continue
      script: |-
        #!/bin/sh
        log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }
        [ -e /tekton/home/.exit-code ] || printf '%s' 0 > /tekton/home/.exit-code
        chmod 0666 /tekton/home/.exit-code 2>/dev/null || true
        __tek_body() (
        # Release build: tags images with semver aliases from the git tag name.
        # latest is only added for stable releases (no hyphen in tag).
        # Per-image values come from step env: DOCKERFILE, IMAGE, optional TARGET,
        # IMAGE_TITLE, IMAGE_DESCRIPTION.
        # buildctl's exit code is captured in $rc and re-exited after writing Chains hints.
        # Context is .buildctx (the commit tree, written by the prepare-build-context step),
        # not the shared workspace — see spec.ts.
        #
        # No --export-cache/--import-cache: see build.sh (ocidex-2vr.3). The persistent buildkitd root
        # replaces the registry build cache; the export cost 85-96s per build for zero import hits.
        TAG="$(params.source-branch)"
        TAG="${TAG#refs/tags/}"
        BARE="${TAG#v}"
        MAJOR=$(echo "$BARE" | cut -d. -f1)
        MINOR=$(echo "$BARE" | cut -d. -f2)

        NAMES="$IMAGE:$TAG,$IMAGE:$MAJOR.$MINOR,$IMAGE:$MAJOR"
        if ! echo "$TAG" | grep -q '-'; then
          NAMES="$NAMES,$IMAGE:latest"
        fi
        CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        # build-arg:DATE must be identical for every image in the chain, or docker/Dockerfile's shared
        # build-all stage re-runs its `go build` for each one instead of hitting CACHED (ocidex-2j2).
        # See build.sh for the full rationale.
        SOURCE_DATE=$(cat .buildctx.date 2>/dev/null) || SOURCE_DATE=""
        if [ -z "$SOURCE_DATE" ]; then SOURCE_DATE="$CREATED"; fi

        # OCI metadata is applied entirely via buildctl CLI (no Dockerfile LABELs):
        #   --opt label:KEY=VALUE      -> per-platform image config labels (docker inspect).
        #     label: is a dockerfile FRONTEND opt; as an image EXPORTER (--output) attribute
        #     buildkit silently ignores it, which is why labels were previously missing.
        #   annotation-index.KEY=VALUE -> OCI annotations on the image index (read by GHCR).
        A=org.opencontainers.image
        SRC=https://github.com/pfenerty/ocidex
        ANN="annotation-index.$A.version=$TAG"
        ANN="$ANN,annotation-index.$A.revision=$(params.revision)"
        ANN="$ANN,annotation-index.$A.created=$CREATED"
        ANN="$ANN,annotation-index.$A.source=$SRC"
        ANN="$ANN,annotation-index.$A.url=$SRC"
        ANN="$ANN,annotation-index.$A.licenses=MIT"
        ANN="$ANN,annotation-index.$A.authors=Patrick Fenerty"
        ANN="$ANN,annotation-index.$A.title=$IMAGE_TITLE"
        ANN="$ANN,annotation-index.$A.description=$IMAGE_DESCRIPTION"

        TARGET_OPT=""
        if [ -n "$TARGET" ]; then TARGET_OPT="--opt target=$TARGET"; fi

        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 \
          --local context=.buildctx \
          --local dockerfile=.buildctx \
          --opt filename="$DOCKERFILE" \
          $TARGET_OPT \
          --opt platform=linux/amd64,linux/arm64 \
          --opt build-arg:VERSION="$TAG" \
          --opt build-arg:COMMIT="$(params.revision)" \
          --opt build-arg:DATE="$SOURCE_DATE" \
          --opt "label:$A.version=$TAG" \
          --opt "label:$A.revision=$(params.revision)" \
          --opt "label:$A.created=$CREATED" \
          --opt "label:$A.source=$SRC" \
          --opt "label:$A.url=$SRC" \
          --opt "label:$A.licenses=MIT" \
          --opt "label:$A.authors=Patrick Fenerty" \
          --opt "label:$A.title=$IMAGE_TITLE" \
          --opt "label:$A.description=$IMAGE_DESCRIPTION" \
          --opt attest:provenance=mode=max \
          --opt attest:sbom= \
          --metadata-file /tmp/buildctl-metadata.json \
          --output "type=image,\"name=$NAMES\",push=true,attestation-manifest-referrers=true,$ANN"
        rc=$?

        # Tekton Chains build-subject hints: record the pushed image ref + digest so Chains
        # attests this run produced this image. Best-effort; never masks buildctl's exit.
        if [ "$rc" -eq 0 ] && [ -n "$CHAINS_IMAGE_URL_PATH" ]; then
          DIGEST=$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' /tmp/buildctl-metadata.json | head -1)
          printf '%s' "$IMAGE" > "$CHAINS_IMAGE_URL_PATH"
          printf '%s' "$DIGEST" > "$CHAINS_IMAGE_DIGEST_PATH"
        fi
        exit "$rc"
        )
        if command -v tee >/dev/null 2>&1; then
          : > /tekton/home/.step-output-build-and-push 2>/dev/null; chmod 0666 /tekton/home/.step-output-build-and-push 2>/dev/null || true
          exec 3>&1
          __tek_rc=$( { { __tek_body 3>&- 4>&- 2>&1; echo $? >&4; } | tee /tekton/home/.step-output-build-and-push >&3; } 4>&1 )
          exec 3>&-
          if [ "$(wc -c < /tekton/home/.step-output-build-and-push 2>/dev/null || echo 0)" -gt 60000 ]; then
            tail -c 60000 /tekton/home/.step-output-build-and-push > /tekton/home/.step-output-build-and-push.tmp && cat /tekton/home/.step-output-build-and-push.tmp > /tekton/home/.step-output-build-and-push; rm -f /tekton/home/.step-output-build-and-push.tmp
          fi
        else
          __tek_body
          __tek_rc=$?
        fi
        if [ "$__tek_rc" -ne 0 ]; then log "error [image-release-operator/build-and-push]: exited with status $__tek_rc"; fi
        __tek_prev=$(cat /tekton/home/.exit-code 2>/dev/null || echo 0)
        if [ "$__tek_rc" -gt "$__tek_prev" ]; then __tek_prev="$__tek_rc"; fi
        printf '%s' "$__tek_prev" > /tekton/home/.exit-code
        exit "$__tek_rc"
      securityContext:
        allowPrivilegeEscalation: true
        capabilities:
          add:
            - SETUID
            - SETGID
          drop: []
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: Unconfined
      volumeMounts:
        - mountPath: /tmp/docker-auth/config.json
          name: docker-config
          readOnly: true
          subPath: .dockerconfigjson
      workingDir: $(workspaces.workspace.path)
    - computeResources:
        requests:
          cpu: 10m
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: git-provider-token
              name: "{{ git_auth_secret }}"
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def gh [method: string, path: string, body?: record]: nothing -> any {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)($path)"
          let headers = [
            Authorization $"Bearer ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
          match $method {
            "POST" => { http post $url $body -t application/json -H $headers }
            "PATCH" => { http patch $url $body -t application/json -H $headers }
            _ => { http get $url -H $headers }
          }
        }

        def now-iso []: nothing -> string { date now | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ' }

        def param-id [value: string]: nothing -> any { if ($value | str trim) =~ '^\d+$' { $value | str trim } else { null } }

        def format-duration [secs: int]: nothing -> string {
          let secs = ([$secs 0] | math max)
          let h = $secs // 3600
          let m = ($secs mod 3600) // 60
          let s = $secs mod 60
          let pad = { |n| $n | into string | fill -a right -w 2 -c '0' }
          if $h > 0 {
            $"($h)h(do $pad $m)m"
          } else if $m > 0 {
            $"($m)m(do $pad $s)s"
          } else {
            $"($s)s"
          }
        }

        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        let step_codes = ([{ name: "prepare-buildkit-root", path: "/tekton/steps/step-prepare-buildkit-root/exitCode", out: "/tekton/home/.step-output-prepare-buildkit-root" } { name: "prepare-build-context", path: "/tekton/steps/step-prepare-build-context/exitCode", out: "/tekton/home/.step-output-prepare-build-context" } { name: "build-and-push", path: "/tekton/steps/step-build-and-push/exitCode", out: "/tekton/home/.step-output-build-and-push" }] | each { |s|
          let ran = ($s.path | path exists)
          { name: $s.name, ran: $ran, out: $s.out, code: (if $ran { try { open --raw $s.path | str trim | into int } catch { 0 } } else { 0 }) }
        })
        let exit_code = ([$contract_code ...($step_codes | each { |s| $s.code })] | math max)
        let conclusion = if $exit_code == 0 { "success" } else { "failure" }
        let failed_steps = ($step_codes | where code != 0)
        let result = if $exit_code == 0 {
          "Passed"
        } else if ($failed_steps | is-empty) {
          $"Failed: exit ($exit_code)"
        } else {
          let first = ($failed_steps | first)
          $"Failed: step ($first.name) exited ($first.code)"
        }
        let duration = (try { format-duration ((date now | format date '%s' | into int) - (open --raw /tekton/home/.status-started-at | str trim | into int)) } catch { null })
        let title = if $duration == null { $result } else { $"($result) in ($duration)" }

        let rows = ($step_codes | each { |s|
          let st = if not $s.ran { "did not run" } else if $s.code == 0 { "passed" } else { $"exited ($s.code)" }
          $"| ($s.name) | ($st) |"
        })
        mut summary = (["| Step | Result |" "| --- | --- |" ...$rows] | str join "\n")
        let tail = if ($failed_steps | is-empty) { "" } else {
          try { open --raw ($failed_steps | first | get out) | into string | ansi strip | str trim -r } catch { "" }
        }
        if ($tail | is-not-empty) {
          $summary = ([$summary "" $"### Output of ($failed_steps | first | get name)" "" "~~~~text" $tail "~~~~"] | str join "\n")
        }
        let annotations = if ($tail | is-empty) { [] } else {
          $tail | lines | parse --regex "^(?<path>[\\w./@+-]+\\.[A-Za-z0-9]+):(?<line>\\d+)(?::(?<col>\\d+))?:\\s*(?<message>\\S.*)$" | first 50 | each { |m|
            let line = ($m.line | into int)
            { path: ($m.path | str replace -r '^\./' ''), start_line: $line, end_line: $line, annotation_level: "failure", message: ($m.message | str trim) }
          }
        }

        let output = ({ title: $title, summary: $summary } | merge (if ($annotations | is-empty) { {} } else { { annotations: $annotations } }))
        let body = ({ status: "completed", conclusion: $conclusion, completed_at: (now-iso), output: $output } | merge { details_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/taskruns/$(context.taskRun.name)" })
        let id = (try { open --raw /tekton/home/.check-run-id | str trim } catch { param-id "$(params.check-run-id)" })
        log $"("report-status [image-release-operator]"): exit-code=($exit_code) conclusion=($conclusion)"
        try {
          if $id != null {
            gh PATCH $"/check-runs/($id)" $body | ignore
          } else {
            gh POST "/check-runs" ($body | merge { name: "image-release-operator", head_sha: "$(params.revision)" }) | ignore
          }
          log $"("report-status [image-release-operator]"): done"
        } catch { |e|
          log $"("report-status [image-release-operator]"): error: ($e.msg)"
        }
        exit $exit_code
  volumes:
    - name: docker-config
      secret:
        secretName: ghcr-docker-config
  workspaces:
    - name: buildkit-release-cache
    - name: workspace
