apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-gofmt-check
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - image: ghcr.io/pfenerty/apko-cicd/golang:1.26
      name: gofmt-check
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def main [] {
        log "Checking gofmt"
        # Not `gofmt -l .` — gofmt's isGoFile skips dot-*files* but filepath.WalkDir still descends
        # into dot-*directories*, and goEnv puts GOMODCACHE/GOCACHE at .go-mod/.go-build inside this
        # same shared workspace. So a bare `.` reports every third-party file in the module cache as
        # unformatted the moment a concurrent task has populated it (ocidex-kmx). nushell's `ls`
        # omits dot-entries, which is exactly the set to skip; node_modules is third-party too.
        # Directories only — gofmt parses explicitly-named files regardless of extension, so passing
        # go.mod or a Makefile would be a parse error rather than a skip.
        let targets = (ls | where type == dir | where name != "node_modules" | get name)
        let unformatted = (^gofmt -l ...$targets | complete | get stdout | str trim)
        if ($unformatted | str length) > 0 {
          print "Unformatted files:"; print $unformatted
          error make {msg: "gofmt: formatting issues found"}
        }
        log "OK: all files formatted"
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let exit_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        let state = if $exit_code == 0 { "success" } else { "failure" }
        let desc = if $exit_code == 0 { "Passed" } else { "Failed" }

        log $"report-status [gofmt-check]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "gofmt-check", description: $desc }

        log $"report-status [gofmt-check]: POST ($url)"
        log $"report-status [gofmt-check]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [gofmt-check]: done"
        } catch { |e|
          log $"report-status [gofmt-check]: error: ($e.msg)"
        }
        exit $exit_code
  workspaces:
    - name: workspace
