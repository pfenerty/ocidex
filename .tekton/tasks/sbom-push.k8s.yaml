apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-sbom-push
  namespace: ocidex-ci
spec:
  params:
    - name: source-branch
      type: string
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    env:
      - name: GOPATH
        value: $(workspaces.workspace.path)/.go-path
      - name: GOMODCACHE
        value: $(workspaces.workspace.path)/.go-mod
      - name: GOCACHE
        value: $(workspaces.workspace.path)/.go-build
      - name: GIT_CONFIG_GLOBAL
        value: $(workspaces.workspace.path)/.gitconfig
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: restore-go-cache-cache
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (
          ["go.sum"]
          | each { |f| if ($f | path exists) { open --raw $f } else { "" } }
          | str join | hash sha256 | str substring 0..15
        )
        $hash | save -f /tekton/home/.cache-go-cache-hash
        if ([".go-mod", ".go-build"] | any { |p| $p | path exists }) {
          log $"restore-go-cache-cache: paths already exist, skipping restore ($hash)"
          exit 0
        }
        let archive = $"$(workspaces.go-cache.path)/($hash).tar.zst"

        if ($archive | path exists) {
          let archive_size = (ls $archive | get size.0)
          log $"restore-go-cache-cache: hit ($hash) size=($archive_size)"
          let cache_paths = [".go-mod", ".go-build"]
          for p in $cache_paths {
            if ($p | path exists) { ^chmod -R u+w $p; rm -rf $p }
          }
          let t0 = (date now)
          ^zstd -d -T1 -c $archive | ^tar xf - -o --no-same-permissions
          let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
          log $"restore-go-cache-cache: restored in ($elapsed)s"
        } else {
          log $"restore-go-cache-cache: miss ($hash)"
        }
      workingDir: $(workspaces.workspace.path)
    - computeResources:
        limits:
          cpu: "2"
          ephemeral-storage: 4Gi
          memory: 2Gi
        requests:
          cpu: 250m
          ephemeral-storage: 2Gi
          memory: 1Gi
      image: ghcr.io/pfenerty/apko-cicd/golang:1.26
      name: build-binaries
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        log $"go=(go version) uid=(id -u) pwd=(pwd)"
        ^git config --global --add safe.directory (pwd)
        mkdir .sbom-bins
        for b in ["ocidex" "scanner-worker" "enrichment-worker" "oci-metadata-worker" "git-worker" "user-enricher-worker" "provenance-worker" "vuln-worker" "operator" "ocidex-cli"] {
          log $"Building ($b)"
          ^go build -o $".sbom-bins/($b)" $"./cmd/($b)"
        }
        # Recorded here rather than assumed at push time: these are native builds, so the
        # architecture is whatever the CI node happens to be, and only this step knows it.
        ^go env GOARCH | str trim | save -f .sbom-bins/.goarch

        # A tag build is the released version; a push to main is not, so it gets a version
        # that sorts below every release and still names the commit it came from.
        #
        # Computed here, in the last step of this task that has a shell, because the steps
        # that consume it run the distroless ocidex-cli image and cannot derive it. They
        # read it back via --version-file (ocidex-2u7y). Folded into this step rather than
        # given one of its own: see the step-count note above.
        let ref = "$(params.source-branch)"
        let rev = "$(params.revision)"
        let version = if ($ref | str starts-with "refs/tags/") {
          $ref | str replace "refs/tags/" ""
        } else {
          $"0.0.0-($rev | str substring 0..7)"
        }
        $version | save -f .sbom-bins/.version
        log $"OK: binaries built for (open .sbom-bins/.goarch | str trim) as version ($version)"
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - computeResources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 256Mi
      image: ghcr.io/pfenerty/apko-cicd/syft:1.45.1
      name: syft-catalog
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        mkdir .sbom-out
        for b in ["ocidex" "scanner-worker" "enrichment-worker" "oci-metadata-worker" "git-worker" "user-enricher-worker" "provenance-worker" "vuln-worker" "operator" "ocidex-cli"] {
          log $"Cataloging ($b)"
          ^syft $"file:.sbom-bins/($b)" -o $"cyclonedx-json=.sbom-out/($b).cdx.json"
        }
        log "OK: SBOMs written to .sbom-out"
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - args:
        - sbom
        - push
        - .sbom-out/ocidex.cdx.json
        - --source
        - ocidex/ci
        - --artifact-file
        - .sbom-bins/ocidex
        - --subject-type
        - application
        - --subject-name
