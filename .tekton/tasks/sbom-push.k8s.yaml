apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-sbom-push
  namespace: ocidex-ci
spec:
  params:
    - name: source-branch
      type: string
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    env:
      - name: GOPATH
        value: $(workspaces.workspace.path)/.go-path
      - name: GOMODCACHE
        value: $(workspaces.workspace.path)/.go-mod
      - name: GOCACHE
        value: $(workspaces.workspace.path)/.go-build
      - name: GIT_CONFIG_GLOBAL
        value: $(workspaces.workspace.path)/.gitconfig
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: restore-go-cache-cache
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (
          ["go.sum"]
          | each { |f| if ($f | path exists) { open --raw $f } else { "" } }
          | str join | hash sha256 | str substring 0..15
        )
        $hash | save -f /tekton/home/.cache-go-cache-hash
        if ([".go-mod", ".go-build"] | any { |p| $p | path exists }) {
          log $"restore-go-cache-cache: paths already exist, skipping restore ($hash)"
          exit 0
        }
        let archive = $"$(workspaces.go-cache.path)/($hash).tar.zst"

        if ($archive | path exists) {
          let archive_size = (ls $archive | get size.0)
          log $"restore-go-cache-cache: hit ($hash) size=($archive_size)"
          let cache_paths = [".go-mod", ".go-build"]
          for p in $cache_paths {
            if ($p | path exists) { ^chmod -R u+w $p; rm -rf $p }
          }
          let t0 = (date now)
          ^zstd -d -T1 -c $archive | ^tar xf - -o --no-same-permissions
          let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
          log $"restore-go-cache-cache: restored in ($elapsed)s"
        } else {
          log $"restore-go-cache-cache: miss ($hash)"
        }
      workingDir: $(workspaces.workspace.path)
    - computeResources:
        limits:
          cpu: "2"
          ephemeral-storage: 4Gi
          memory: 2Gi
        requests:
          cpu: 250m
          ephemeral-storage: 2Gi
          memory: 1Gi
      image: ghcr.io/pfenerty/apko-cicd/golang:1.26
      name: build-binaries
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        log $"go=(go version) uid=(id -u) pwd=(pwd)"
        ^git config --global --add safe.directory (pwd)
        mkdir .sbom-bins
        for b in ["ocidex" "scanner-worker" "oci-metadata-worker" "git-worker" "user-enricher-worker" "provenance-worker" "vuln-worker" "k8s-agent" "operator" "ocidex-cli" "ocidex-mcp"] {
          log $"Building ($b)"
          ^go build -o $".sbom-bins/($b)" $"./cmd/($b)"
        }
        # Recorded here rather than assumed at push time: these are native builds, so the
        # architecture is whatever the CI node happens to be, and only this step knows it.
        ^go env GOARCH | str trim | save -f .sbom-bins/.goarch

        # A tag build is the released version; a push to main is not, so it gets a version
        # that sorts below every release and still names the commit it came from.
        #
        # Written to disk rather than derived at push time: only this step has the params
        # in scope, and push-sboms.nu hands the file straight to --version-file, which
        # errors on a missing or blank file instead of pushing a versionless SBOM
        # (ocidex-2u7y). Folded into this step rather than given one of its own: see the
        # step-count note above.
        let ref = "$(params.source-branch)"
        let rev = "$(params.revision)"
        let version = if ($ref | str starts-with "refs/tags/") {
          $ref | str replace "refs/tags/" ""
        } else {
          $"0.0.0-($rev | str substring 0..7)"
        }
        $version | save -f .sbom-bins/.version
        log $"OK: binaries built for (open .sbom-bins/.goarch | str trim) as version ($version)"
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [sbom-push/build-binaries]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - computeResources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 256Mi
      image: ghcr.io/pfenerty/apko-cicd/syft:1.45.1
      name: syft-catalog
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        mkdir .sbom-out
        for b in ["ocidex" "scanner-worker" "oci-metadata-worker" "git-worker" "user-enricher-worker" "provenance-worker" "vuln-worker" "k8s-agent" "operator" "ocidex-cli" "ocidex-mcp"] {
          log $"Cataloging ($b)"
          ^syft $"file:.sbom-bins/($b)" -o $"cyclonedx-json=.sbom-out/($b).cdx.json"
        }
        log "OK: SBOMs written to .sbom-out"
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [sbom-push/syft-catalog]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - computeResources:
        limits:
          cpu: "1"
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi
      env:
        - name: OCIDEX_URL
          value: http://ocidex-dev-api.ocidex-dev.svc.cluster.local
        - name: OCIDEX_API_KEY
          valueFrom:
            secretKeyRef:
              key: key
              name: ocidex-api-key
              optional: true
        - name: OCIDEX_SOURCE
          value: ocidex/ci
        - name: OCIDEX_BINARIES
          value: ocidex scanner-worker oci-metadata-worker git-worker user-enricher-worker provenance-worker vuln-worker k8s-agent operator ocidex-cli ocidex-mcp
      image: ghcr.io/pfenerty/apko-cicd/golang:1.26
      name: push-sboms
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        # Pushes one SBOM per shipped binary using the ocidex-cli that build-binaries just
        # compiled from this commit (ocidex-qzz2). See spec.ts for why the workspace binary
        # is used rather than the published ghcr.io/pfenerty/ocidex-cli image.
        if ($env.OCIDEX_API_KEY? | is-empty) {
          log "OCIDEX_API_KEY is unset - skipping SBOM upload"
          exit 0
        }

        # Both files are written by build-binaries. They are passed as --version-file /
        # --arch-file rather than read and expanded here: the CLI errors on a missing or
        # blank file, so a failed build step surfaces as a refusal instead of a versionless
        # SBOM nobody notices. This read is for the log line only, hence the guard.
        let version = if (".sbom-bins/.version" | path exists) {
          open .sbom-bins/.version | str trim
        } else {
          "<unwritten>"
        }

        let binaries = ($env.OCIDEX_BINARIES | split row " ")
        log $"pushing ($binaries | length) SBOMs as version ($version) to ($env.OCIDEX_URL)"

        mut failed = []
        for b in $binaries {
          # The subject is declared rather than inferred: a syft scan of a binary names the
          # file it read, and the purl it derives is the Go *module*, which every binary
          # shares. Group + name are what keep them distinct artifacts.
          #
          # The purl carries no @version. artifact.purl is an attribute, not part of the
          # artifact's identity — UpsertArtifact conflicts on (type, name, group) — so a
          # versioned purl only churned the stored value on every push while the version
          # that matters lives on sbom.subject_version. It also keys the same way ADR-019
          # Rule 1 and ADR-041 do, on the purl base.
          #
          # Built as a list and spread, because a bare multi-line external invocation is a
          # separate command per line in nushell.
          let args = [
            "sbom" "push" $".sbom-out/($b).cdx.json"
            "--source" $env.OCIDEX_SOURCE
            "--artifact-file" $".sbom-bins/($b)"
            "--subject-type" "application"
            "--subject-name" $b
            "--subject-group" "github.com/pfenerty/ocidex"
            "--subject-purl" $"pkg:golang/github.com/pfenerty/ocidex/cmd/($b)"
            "--version-file" ".sbom-bins/.version"
            "--arch-file" ".sbom-bins/.goarch"
          ]
          let result = (do { ^.sbom-bins/ocidex-cli ...$args } | complete)

          if $result.exit_code == 0 {
            log $"pushed ($b): ($result.stdout | str trim)"
          } else {
            log $"FAILED ($b): ($result.stdout | str trim) ($result.stderr | str trim)"
            $failed = ($failed | append $b)
          }
        }

        if not ($failed | is-empty) {
          # `error make`, never `exit 1` (ocidex-es6): nushell's `exit` kills the process
          # before tektonic's try/catch can persist the code to /tekton/home/.exit-code,
          # which — with onError: continue on this step — reports a real failure as green.
          # That is exactly how this task hid nine broken uploads (ocidex-qzz2).
          #
          # Raising cannot gate a release: reportOnlyStatusReporter is failOnError: false,
          # so this marks the sbom-push check red and leaves the pipeline succeeding.
          error make {
            msg: $"($failed | length) of ($binaries | length) uploads failed: ($failed | str join ', ')"
          }
        }
        log $"OK: all ($binaries | length) SBOMs pushed"
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [sbom-push/push-sboms]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: save-go-cache-cache
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (try { open --raw /tekton/home/.cache-go-cache-hash | str trim } catch { "" })
        if ($hash | is-empty) { log "save-go-cache-cache: no hash, skipping"; exit 0 }

        let archive = $"$(workspaces.go-cache.path)/($hash).tar.zst"
        if ($archive | path exists) { log $"save-go-cache-cache: ($hash) exists, skipping"; exit 0 }

        let paths = [".go-mod", ".go-build"] | where { |p| ($p | path exists) }
        if ($paths | is-empty) { log "save-go-cache-cache: no paths to cache"; exit 0 }

        for p in $paths { ^chmod -R u+w $p }

        let max = 3
        if $max > 0 {
          let entries = (try { ls $(workspaces.go-cache.path)/*.tar.zst | sort-by modified | reverse | skip $max } catch { [] })
          for e in $entries { log $"save-go-cache-cache: evicting ($e.name | path basename)"; rm $e.name }
        }

        let uncompressed = ($paths | each { |p| try { du $p | get apparent.0 | into int } catch { 0 } } | math sum)
        log $"save-go-cache-cache: compressing (($uncompressed / 1_000_000) | math round --precision 1)MB uncompressed ..."
        let t0 = (date now)
        # Write to a temp path and rename into place: a step killed mid-write (OOM, eviction,
        # timeout) must never leave a truncated archive at the real hash-keyed path, since the
        # skip-if-exists guard above means a corrupt archive there would never self-heal.
        let tmp = $"($archive).tmp.(random uuid)"
        # nushell aborts the enclosing block as soon as any external command in the pipe
        # reports a non-zero exit (e.g. tar failing to read one of $paths), so cleanup must
        # live in a catch — code placed after the pipe but outside try/catch never runs.
        try {
          ^tar cf - ...$paths | ^zstd -1 -T1 -o $tmp
        } catch { |e|
          rm -f $tmp
          log $"save-go-cache-cache: compress failed (($e.msg)), discarding partial archive"
          exit 1
        }
        mv -f $tmp $archive
        let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
        let compressed = (ls $archive | get size.0)
        let ratio = ($uncompressed / ($compressed | into int) | math round --precision 1)
        log $"save-go-cache-cache: saved ($compressed) ratio=($ratio)x in ($elapsed)s"
      workingDir: $(workspaces.workspace.path)
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = (["/tekton/steps/step-build-binaries/exitCode" "/tekton/steps/step-syft-catalog/exitCode" "/tekton/steps/step-push-sboms/exitCode"] | each { |p| try { open --raw $p | str trim | into int } catch { 0 } })
        let exit_code = ([$contract_code ...$step_codes] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        let desc = if $exit_code == 0 { "Passed" } else { "Failed" }

        log $"report-status [sbom-push]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "sbom-push", description: $desc }

        log $"report-status [sbom-push]: POST ($url)"
        log $"report-status [sbom-push]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [sbom-push]: done"
        } catch { |e|
          log $"report-status [sbom-push]: error: ($e.msg)"
        }
  workspaces:
    - name: go-cache
    - name: workspace
