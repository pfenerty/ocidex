apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-helm-release
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  results:
    - description: Fully-qualified reference of the chart-ocidex image (Tekton Chains subject)
      name: chart-ocidex-IMAGE_URL
      type: string
    - description: Digest (alg:hex) of the chart-ocidex image (Tekton Chains subject)
      name: chart-ocidex-IMAGE_DIGEST
      type: string
    - description: Fully-qualified reference of the chart-ocidex-operator image (Tekton Chains subject)
      name: chart-ocidex-operator-IMAGE_URL
      type: string
    - description: Digest (alg:hex) of the chart-ocidex-operator image (Tekton Chains subject)
      name: chart-ocidex-operator-IMAGE_DIGEST
      type: string
    - description: Fully-qualified reference of the chart-ocidex-k8s-agent image (Tekton Chains subject)
      name: chart-ocidex-k8s-agent-IMAGE_URL
      type: string
    - description: Digest (alg:hex) of the chart-ocidex-k8s-agent image (Tekton Chains subject)
      name: chart-ocidex-k8s-agent-IMAGE_DIGEST
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - env:
        - name: DOCKER_CONFIG
          value: /tmp/helm-auth
        - name: CHAINS_OCIDEX_URL_PATH
          value: $(results.chart-ocidex-IMAGE_URL.path)
        - name: CHAINS_OCIDEX_DIGEST_PATH
          value: $(results.chart-ocidex-IMAGE_DIGEST.path)
        - name: CHAINS_OPERATOR_URL_PATH
          value: $(results.chart-ocidex-operator-IMAGE_URL.path)
        - name: CHAINS_OPERATOR_DIGEST_PATH
          value: $(results.chart-ocidex-operator-IMAGE_DIGEST.path)
        - name: CHAINS_AGENT_URL_PATH
          value: $(results.chart-ocidex-k8s-agent-IMAGE_URL.path)
        - name: CHAINS_AGENT_DIGEST_PATH
          value: $(results.chart-ocidex-k8s-agent-IMAGE_DIGEST.path)
      image: alpine/helm:4
      name: helm-package-push
      onError: continue
      script: |-
        #!/bin/sh
        log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }
        [ -e /tekton/home/.exit-code ] || printf '%s' 0 > /tekton/home/.exit-code
        chmod 0666 /tekton/home/.exit-code 2>/dev/null || true
        (
        # Package and push the ocidex Helm charts for a tagged release, pinning each image
        # to its immutable digest. Single step under `set -e` so a failed digest resolve
        # aborts BEFORE any chart is pushed — never publish a partially-pinned chart.
        # (tektonic wraps this with onError:continue + exit-code capture, so the step must
        # just exit non-zero on failure; the report-status step surfaces it.)
        #
        # crane (fetched below) resolves the multi-arch index digest of each pushed image;
        # it authenticates via $DOCKER_CONFIG/config.json (the mounted registry creds).
        # `${VAR#prefix}` is avoided (tektonic synth can drop it); use sed instead.
        set -e

        TAG="$(params.source-branch)"
        TAG=$(echo "$TAG" | sed 's|^refs/tags/||')
        VERSION=$(echo "$TAG" | sed 's|^v||')

        # --- Fetch crane (alpine/helm image has no digest tool) ----------------------
        CRANE_VERSION="v0.20.2"
        case "$(uname -m)" in
          x86_64) CRANE_ARCH="x86_64" ;;
          aarch64 | arm64) CRANE_ARCH="arm64" ;;
          *) echo "ERROR: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        wget -qO /tmp/crane.tgz \
          "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz"
        tar -xzf /tmp/crane.tgz -C /tmp crane

        # --- Resolve digests and bake them into chart values -------------------------
        # App components (charts/ocidex); operator is a separate chart handled below.
        # Must stay in sync with every component charts/ocidex renders a Deployment for —
        # a missing entry leaves that image unpinned in the released chart.
        COMPONENTS="api scanner-worker oci-metadata-worker git-worker user-enricher-worker provenance-worker vuln-worker web"

        # Build the image.digests block in a file (portable: no embedded newlines in awk vars).
        echo "  digests:" > /tmp/digests-block.yaml
        for comp in $COMPONENTS; do
          ref="ghcr.io/pfenerty/ocidex-${comp}:${TAG}"
          digest=$(/tmp/crane digest "$ref")
          if [ -z "$digest" ]; then
            echo "ERROR: could not resolve digest for $ref" >&2
            exit 1
          fi
          echo "resolved $ref -> $digest"
          echo "    ${comp}: ${digest}" >> /tmp/digests-block.yaml
        done

        # Replace the "  digests: {}" placeholder line with the resolved block.
        awk '/^  digests: \{\}$/ {
               while ((getline line < "/tmp/digests-block.yaml") > 0) print line
               close("/tmp/digests-block.yaml"); next
             }
             { print }' charts/ocidex/values.yaml > /tmp/ocidex-values.yaml
        mv /tmp/ocidex-values.yaml charts/ocidex/values.yaml

        # Operator chart: single image, scalar image.digest.
        op_ref="ghcr.io/pfenerty/ocidex-operator:${TAG}"
        op_digest=$(/tmp/crane digest "$op_ref")
        if [ -z "$op_digest" ]; then
          echo "ERROR: could not resolve digest for $op_ref" >&2
          exit 1
        fi
        echo "resolved $op_ref -> $op_digest"
        sed -i "s|^  digest: \"\"\$|  digest: ${op_digest}|" charts/ocidex-operator/values.yaml

        # Agent chart: single image, scalar image.digest, same shape as the operator.
        agent_ref="ghcr.io/pfenerty/ocidex-k8s-agent:${TAG}"
        agent_digest=$(/tmp/crane digest "$agent_ref")
        if [ -z "$agent_digest" ]; then
          echo "ERROR: could not resolve digest for $agent_ref" >&2
          exit 1
        fi
        echo "resolved $agent_ref -> $agent_digest"
        sed -i "s|^  digest: \"\"\$|  digest: ${agent_digest}|" charts/ocidex-k8s-agent/values.yaml

        echo "--- charts/ocidex/values.yaml image block ---"
        grep -A 12 '^image:' charts/ocidex/values.yaml

        # --- Package and push --------------------------------------------------------
        helm package charts/ocidex --version "${VERSION}" --app-version "${TAG}"
        helm package charts/ocidex-operator --version "${VERSION}" --app-version "${TAG}"
        helm package charts/ocidex-k8s-agent --version "${VERSION}" --app-version "${TAG}"
        # Each push reports the chart's OCI ref + digest as a Tekton Chains build subject
        # (<name>-IMAGE_URL/-IMAGE_DIGEST results, paths in $CHAINS_<NAME>_URL_PATH etc. from
        # spec.ts), so Chains signs the chart and attaches SLSA provenance exactly as it does
        # for the images; verify with `cosign verify --key cosign.pub` (ocidex-tkn9.10).
        # Under `set -e` a failed push stops before its results are written, and an unparsed
        # digest fails the step rather than leaving a chart silently unsigned.
        push_chart() {
          chart="$1"; url_path="$2"; digest_path="$3"
          # Not `| tee`: a pipeline's status is tee's, so set -e would miss a failed push.
          if ! helm push "${chart}-${VERSION}.tgz" oci://ghcr.io/pfenerty/charts > /tmp/helm-push.log 2>&1; then
            cat /tmp/helm-push.log
            exit 1
          fi
          cat /tmp/helm-push.log
          digest=$(sed -n 's/^Digest: *\(sha256:[0-9a-f]\{64\}\).*/\1/p' /tmp/helm-push.log | head -1)
          if [ -z "$digest" ]; then
            echo "ERROR: no digest in helm push output for ${chart}" >&2
            exit 1
          fi
          printf '%s' "ghcr.io/pfenerty/charts/${chart}" > "$url_path"
          printf '%s' "$digest" > "$digest_path"
          echo "chains subject: ghcr.io/pfenerty/charts/${chart}@${digest}"
        }
        push_chart ocidex "$CHAINS_OCIDEX_URL_PATH" "$CHAINS_OCIDEX_DIGEST_PATH"
        push_chart ocidex-operator "$CHAINS_OPERATOR_URL_PATH" "$CHAINS_OPERATOR_DIGEST_PATH"
        push_chart ocidex-k8s-agent "$CHAINS_AGENT_URL_PATH" "$CHAINS_AGENT_DIGEST_PATH"
        )
        __tek_rc=$?
        if [ "$__tek_rc" -ne 0 ]; then log "error [helm-release/helm-package-push]: exited with status $__tek_rc"; fi
        __tek_prev=$(cat /tekton/home/.exit-code 2>/dev/null || echo 0)
        if [ "$__tek_rc" -gt "$__tek_prev" ]; then __tek_prev="$__tek_rc"; fi
        printf '%s' "$__tek_prev" > /tekton/home/.exit-code
        exit "$__tek_rc"
      volumeMounts:
        - mountPath: /tmp/helm-auth/config.json
          name: docker-config
          readOnly: true
          subPath: .dockerconfigjson
      workingDir: $(workspaces.workspace.path)
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = ([{ name: "helm-package-push", path: "/tekton/steps/step-helm-package-push/exitCode" }] | each { |s| { name: $s.name, code: (try { open --raw $s.path | str trim | into int } catch { 0 }) } })
        let exit_code = ([$contract_code ...($step_codes | each { |s| $s.code })] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        # Name the first step that failed, so the check says where without opening the logs.
        let failed_steps = ($step_codes | where code != 0)
        let desc = if $exit_code == 0 {
          "Passed"
        } else if ($failed_steps | is-empty) {
          $"Failed: exit ($exit_code)"
        } else {
          let first = ($failed_steps | first)
          $"Failed: step ($first.name) exited ($first.code)"
        }

        log $"report-status [helm-release]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "helm-release", description: $desc }

        log $"report-status [helm-release]: POST ($url)"
        log $"report-status [helm-release]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [helm-release]: done"
        } catch { |e|
          log $"report-status [helm-release]: error: ($e.msg)"
        }
        exit $exit_code
  volumes:
    - name: docker-config
      secret:
        secretName: ghcr-docker-config
  workspaces:
    - name: workspace
