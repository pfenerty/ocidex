apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-reconcile-status-ocidex-tag
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
    - name: pipeline-run-name
      type: string
    - name: status-image-release-api
      type: string
    - name: status-go-test
      type: string
    - name: status-go-build
      type: string
    - name: status-go-integration-test
      type: string
    - name: status-openapi-verify
      type: string
    - name: status-eslint-lint-web
      type: string
    - name: status-image-release-scanner-worker
      type: string
    - name: status-image-release-oci-metadata-worker
      type: string
    - name: status-image-release-git-worker
      type: string
    - name: status-image-release-user-enricher-worker
      type: string
    - name: status-image-release-provenance-worker
      type: string
    - name: status-image-release-vuln-worker
      type: string
    - name: status-image-release-web
      type: string
    - name: status-image-release-k8s-agent
      type: string
    - name: status-image-release-operator
      type: string
    - name: status-image-release-cli
      type: string
    - name: status-helm-check
      type: string
    - name: status-helm-release
      type: string
    - name: status-gh-release
      type: string
    - name: status-sbom-push
      type: string
    - name: check-run-image-release-api
      type: string
    - name: check-run-go-test
      type: string
    - name: check-run-go-build
      type: string
    - name: check-run-go-integration-test
      type: string
    - name: check-run-openapi-verify
      type: string
    - name: check-run-eslint-lint-web
      type: string
    - name: check-run-image-release-scanner-worker
      type: string
    - name: check-run-image-release-oci-metadata-worker
      type: string
    - name: check-run-image-release-git-worker
      type: string
    - name: check-run-image-release-user-enricher-worker
      type: string
    - name: check-run-image-release-provenance-worker
      type: string
    - name: check-run-image-release-vuln-worker
      type: string
    - name: check-run-image-release-web
      type: string
    - name: check-run-image-release-k8s-agent
      type: string
    - name: check-run-image-release-operator
      type: string
    - name: check-run-image-release-cli
      type: string
    - name: check-run-helm-check
      type: string
    - name: check-run-helm-release
      type: string
    - name: check-run-gh-release
      type: string
    - name: check-run-sbom-push
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  steps:
    - computeResources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: git-provider-token
              name: "{{ git_auth_secret }}"
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: reconcile
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def gh [method: string, path: string, body?: record]: nothing -> any {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)($path)"
          let headers = [
            Authorization $"Bearer ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
          match $method {
            "POST" => { http post $url $body -t application/json -H $headers }
            "PATCH" => { http patch $url $body -t application/json -H $headers }
            _ => { http get $url -H $headers }
          }
        }

        def now-iso []: nothing -> string { date now | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ' }

        def param-id [value: string]: nothing -> any { if ($value | str trim) =~ '^\d+$' { $value | str trim } else { null } }

        let entries = [
          { status: "$(params.status-image-release-api)", context: "image-release-api", id: "$(params.check-run-image-release-api)" }
          { status: "$(params.status-go-test)", context: "go-test", id: "$(params.check-run-go-test)" }
          { status: "$(params.status-go-build)", context: "go-build", id: "$(params.check-run-go-build)" }
          { status: "$(params.status-go-integration-test)", context: "go-integration-test", id: "$(params.check-run-go-integration-test)" }
          { status: "$(params.status-openapi-verify)", context: "openapi-verify", id: "$(params.check-run-openapi-verify)" }
          { status: "$(params.status-eslint-lint-web)", context: "eslint-lint-web", id: "$(params.check-run-eslint-lint-web)" }
          { status: "$(params.status-image-release-scanner-worker)", context: "image-release-scanner-worker", id: "$(params.check-run-image-release-scanner-worker)" }
          { status: "$(params.status-image-release-oci-metadata-worker)", context: "image-release-oci-metadata-worker", id: "$(params.check-run-image-release-oci-metadata-worker)" }
          { status: "$(params.status-image-release-git-worker)", context: "image-release-git-worker", id: "$(params.check-run-image-release-git-worker)" }
          { status: "$(params.status-image-release-user-enricher-worker)", context: "image-release-user-enricher-worker", id: "$(params.check-run-image-release-user-enricher-worker)" }
          { status: "$(params.status-image-release-provenance-worker)", context: "image-release-provenance-worker", id: "$(params.check-run-image-release-provenance-worker)" }
          { status: "$(params.status-image-release-vuln-worker)", context: "image-release-vuln-worker", id: "$(params.check-run-image-release-vuln-worker)" }
          { status: "$(params.status-image-release-web)", context: "image-release-web", id: "$(params.check-run-image-release-web)" }
          { status: "$(params.status-image-release-k8s-agent)", context: "image-release-k8s-agent", id: "$(params.check-run-image-release-k8s-agent)" }
          { status: "$(params.status-image-release-operator)", context: "image-release-operator", id: "$(params.check-run-image-release-operator)" }
          { status: "$(params.status-image-release-cli)", context: "image-release-cli", id: "$(params.check-run-image-release-cli)" }
          { status: "$(params.status-helm-check)", context: "helm-check", id: "$(params.check-run-helm-check)" }
          { status: "$(params.status-helm-release)", context: "helm-release", id: "$(params.check-run-helm-release)" }
          { status: "$(params.status-gh-release)", context: "gh-release", id: "$(params.check-run-gh-release)" }
          { status: "$(params.status-sbom-push)", context: "sbom-push", id: "$(params.check-run-sbom-push)" }
        ]

        let failed = $entries | each { |entry|
          let label = $"reconcile-status [($entry.context)]"
          if $entry.status not-in ["None" "Failed"] {
            log $"($label): task status is ($entry.status), nothing to resolve"
            null
          } else {
            let id = (param-id $entry.id)
            let done = if $id == null { false } else {
              try { (gh GET $"/check-runs/($id)" | get status) == "completed" } catch { false }
            }
            if $done {
              log $"($label): check run ($id) already completed"
              null
            } else {
              let skipped = $entry.status == "None"
              let conclusion = if $skipped { "skipped" } else { "failure" }
              let output = if $skipped {
                { title: "Skipped", summary: "Tekton skipped this task: a when expression was false, or a task it depends on failed or was skipped." }
              } else {
                { title: "Failed or terminated", summary: "The task failed before it could report its own result. Its pod was killed (OOMKill, eviction), the TaskRun timed out, or the pod never started (image pull). See the PipelineRun for details." }
              }
              let body = ({ status: "completed", conclusion: $conclusion, completed_at: (now-iso), output: $output } | merge { details_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/pipelineruns/$(params.pipeline-run-name)" })
              log $"($label): task status is ($entry.status)"
              try {
                if $id != null {
                  gh PATCH $"/check-runs/($id)" $body | ignore
                } else {
                  gh POST "/check-runs" ($body | merge { name: $entry.context, head_sha: "$(params.revision)" }) | ignore
                }
                null
              } catch { |e|
                log $"($label): error: ($e.msg)"
                $entry.context
              }
            }
          }
        } | compact

        if ($failed | is-not-empty) {
          log $"reconcile-status: ($failed | length) failed: ($failed | str join ', ')"
          exit 1
        }
