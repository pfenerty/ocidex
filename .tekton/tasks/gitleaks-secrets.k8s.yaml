apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-gitleaks-secrets
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
    - name: pipeline-run-name
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-running
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def post-status [label: string, body: record]: nothing -> bool {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
          log $"($label): POST ($url)"
          log $"($label): body: ($body | to json -r)"
          try {
            http post $url $body -t application/json -H [
              Authorization $"token ($env.GITHUB_TOKEN)"
              Accept "application/vnd.github+json"
            ]
            log $"($label): done"
            true
          } catch { |e|
            log $"($label): error: ($e.msg)"
            false
          }
        }

        try { date now | format date '%s' | save -f /tekton/home/.status-started-at } catch { |e| log $"report-running: cannot record start time: ($e.msg)" }

        let body = ({ state: "pending", context: "gitleaks-secrets", description: "Running" } | merge { target_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/taskruns/$(context.taskRun.name)" })
        post-status "report-running [gitleaks-secrets]" $body | ignore
    - computeResources:
        limits:
          cpu: "1"
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
      env:
        - name: HOME
          value: /tmp
      image: ghcr.io/pfenerty/apko-cicd/gitleaks:8.30.1
      name: gitleaks-scan
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        ^git config --global --add safe.directory '*'
        let pac_event = ($env.PAC_EVENT_TYPE? | default "")
        let pac_target = ($env.PAC_TARGET_BRANCH? | default "")
        mut scoped = false
        if $pac_event == "pull_request" and ($pac_target | is-not-empty) {
          let fetched = (do { ^git -c safe.directory='*' fetch --quiet origin $pac_target } | complete)
          if $fetched.exit_code == 0 { $scoped = true }
        }
        let logopts = if $scoped { ["--log-opts=FETCH_HEAD..HEAD"] } else { [] }
        ^gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner ...$logopts
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [gitleaks-secrets/gitleaks-scan]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def format-duration [secs: int]: nothing -> string {
          let secs = ([$secs 0] | math max)
          let h = $secs // 3600
          let m = ($secs mod 3600) // 60
          let s = $secs mod 60
          let pad = { |n| $n | into string | fill -a right -w 2 -c '0' }
          if $h > 0 {
            $"($h)h(do $pad $m)m"
          } else if $m > 0 {
            $"($m)m(do $pad $s)s"
          } else {
            $"($s)s"
          }
        }

        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = ([{ name: "gitleaks-scan", path: "/tekton/steps/step-gitleaks-scan/exitCode" }] | each { |s| { name: $s.name, code: (try { open --raw $s.path | str trim | into int } catch { 0 }) } })
        let exit_code = ([$contract_code ...($step_codes | each { |s| $s.code })] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        # Name the first step that failed, so the check says where without opening the logs.
        let failed_steps = ($step_codes | where code != 0)
        let result = if $exit_code == 0 {
          "Passed"
        } else if ($failed_steps | is-empty) {
          $"Failed: exit ($exit_code)"
        } else {
          let first = ($failed_steps | first)
          $"Failed: step ($first.name) exited ($first.code)"
        }
        # Only a start step records the start time; without one the description carries no duration.
        let duration = (try { format-duration ((date now | format date '%s' | into int) - (open --raw /tekton/home/.status-started-at | str trim | into int)) } catch { null })
        let desc = if $duration == null {
          $result
        } else if $exit_code == 0 {
          $"Passed in ($duration)"
        } else {
          $"($result) \(($duration)\)"
        }

        log $"report-status [gitleaks-secrets]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = ({ state: $state, context: "gitleaks-secrets", description: $desc } | merge { target_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/taskruns/$(context.taskRun.name)" })

        log $"report-status [gitleaks-secrets]: POST ($url)"
        log $"report-status [gitleaks-secrets]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [gitleaks-secrets]: done"
        } catch { |e|
          log $"report-status [gitleaks-secrets]: error: ($e.msg)"
        }
  workspaces:
    - name: workspace
