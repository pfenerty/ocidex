apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-govulncheck-scan
  namespace: ocidex-ci
spec:
  params:
    - description: Branch or tag ref of the event, bound by PAC from source_branch
      name: source-branch
      type: string
    - name: repo-full-name
      type: string
    - name: revision
      type: string
    - name: pipeline-run-name
      type: string
    - name: check-run-id
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    env:
      - name: GOPATH
        value: $(workspaces.workspace.path)/.go-path
      - name: GOMODCACHE
        value: $(workspaces.workspace.path)/.go-mod
      - name: GOCACHE
        value: $(workspaces.workspace.path)/.go-build
      - name: GOFLAGS
        value: -modcacherw
      - name: GIT_CONFIG_GLOBAL
        value: $(workspaces.workspace.path)/.gitconfig
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - computeResources:
        requests:
          cpu: 10m
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: git-provider-token
              name: "{{ git_auth_secret }}"
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-running
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def gh [method: string, path: string, body?: record]: nothing -> any {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)($path)"
          let headers = [
            Authorization $"Bearer ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
          match $method {
            "POST" => { http post $url $body -t application/json -H $headers }
            "PATCH" => { http patch $url $body -t application/json -H $headers }
            _ => { http get $url -H $headers }
          }
        }

        def now-iso []: nothing -> string { date now | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ' }

        def param-id [value: string]: nothing -> any { if ($value | str trim) =~ '^\d+$' { $value | str trim } else { null } }

        try { date now | format date '%s' | save -f /tekton/home/.status-started-at } catch { |e| log $"check-running: cannot record start time: ($e.msg)" }

        let id = (param-id "$(params.check-run-id)")
        let body = ({ status: "in_progress", started_at: (now-iso) } | merge { details_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/taskruns/$(context.taskRun.name)" })
        let id = if $id != null {
          try { gh PATCH $"/check-runs/($id)" $body | ignore; log $"("check-running [govulncheck-scan]"): check run ($id) in progress" } catch { |e| log $"("check-running [govulncheck-scan]"): error: ($e.msg)" }
          $id
        } else {
          # The pending task could not create the run; create it here instead.
          try {
            let id = (gh POST "/check-runs" ($body | merge { name: "govulncheck-scan", head_sha: "$(params.revision)" }) | get id | into string)
            log $"("check-running [govulncheck-scan]"): created check run ($id)"
            $id
          } catch { |e| log $"("check-running [govulncheck-scan]"): error: ($e.msg)"; null }
        }
        if $id != null { $id | save -f /tekton/home/.check-run-id }
    - computeResources:
        requests:
          cpu: 10m
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: restore-go-cache-cache
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (
          ["go.sum"]
          | each { |f| if ($f | path exists) { open --raw $f } else { "" } }
          | str join | hash sha256 | str substring 0..15
        )
        $hash | save -f /tekton/home/.cache-go-cache-hash
        if ([".go-mod", ".go-build"] | any { |p| $p | path exists }) {
          log $"restore-go-cache-cache: paths already exist, skipping restore ($hash)"
          exit 0
        }
        let archive = $"$(workspaces.go-cache.path)/($hash).tar.zst"

        if ($archive | path exists) {
          let archive_size = (ls $archive | get size.0)
          log $"restore-go-cache-cache: hit ($hash) size=($archive_size)"
          let t0 = (date now)
          let stage = $".cache-restore-(random uuid)"
          mkdir $stage
          try {
            ^zstd -d -T1 -c $archive | ^tar xf - -C $stage -o --no-same-permissions
          } catch { |e|
            try { ^chmod -R u+w $stage } catch { }
            rm -rf $stage
            log $"restore-go-cache-cache: extract failed \(($e.msg)\)"
            rm -f $archive
            log $"restore-go-cache-cache: removed unextractable archive, treating as a miss ($hash)"
            exit 0
          }
          for p in [".go-mod", ".go-build"] {
            let staged = ($stage | path join $p)
            if not ($staged | path exists) { continue }
            if ($p | path exists) {
              # Rename the live tree aside and move the new one in — never delete in place. The
              # displaced tree is removed afterwards and best-effort: a concurrent writer still inside
              # it can legitimately make that fail, and by then nothing resolves to it by path.
              let displaced = $"($p).displaced-(random uuid)"
              mv $p $displaced
              mv $staged $p
              try { ^chmod -R u+w $displaced; rm -rf $displaced } catch { |e|
                log $"restore-go-cache-cache: displaced tree ($displaced) not removed: ($e.msg)"
              }
            } else {
              let parent = ($p | path dirname)
              if (($parent | str length) > 0) and ($parent != ".") { mkdir $parent }
              mv $staged $p
            }
          }
          rm -rf $stage
          let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
          log $"restore-go-cache-cache: restored in ($elapsed)s"
        } else {
          log $"restore-go-cache-cache: miss ($hash)"
        }
      workingDir: $(workspaces.workspace.path)
    - computeResources:
        limits:
          cpu: "2"
          ephemeral-storage: 4Gi
          memory: 6Gi
        requests:
          cpu: 500m
          ephemeral-storage: 2Gi
          memory: 4Gi
      env:
        - name: GOMEMLIMIT
          value: 5GiB
      image: ghcr.io/pfenerty/apko-cicd/govulncheck:1.9.0-go1.27
      name: govulncheck-scan
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        log $"go=(go version) uid=(id -u) pwd=(pwd)"
        ^git config --global --add safe.directory (pwd)
        let bins = (ls cmd | where type == dir | get name | each {|d| $d | path basename} | sort)
        let package_bins = ["scanner-worker" "vuln-parity" "vuln-worker"]
        mut failed = []
        for bin in $bins {
          # The watchdog's command is sh, so the binary and scan mode cross over as env vars.
          $env.VULN_BIN = $bin
          $env.VULN_SCAN = (if $bin in $package_bins { "package" } else { "symbol" })
          log $"Running govulncheck -scan ($env.VULN_SCAN) -format sarif ./cmd/($bin)"
          # try yields a value rather than mutating $failed: catch is a closure and can't capture it.
          let ok = (try {
            ^sh -c r#'govulncheck -scan "$VULN_SCAN" -format sarif "./cmd/$VULN_BIN" > "govulncheck-$VULN_BIN.sarif" &
            pid=$!
            max_file=/sys/fs/cgroup/memory.max
            cur_file=/sys/fs/cgroup/memory.current
            [ -f "$max_file" ] || max_file=/sys/fs/cgroup/memory/memory.limit_in_bytes
            [ -f "$cur_file" ] || cur_file=/sys/fs/cgroup/memory/memory.usage_in_bytes
            stat_file=/sys/fs/cgroup/memory.stat
            mem_max=$(cat "$max_file" 2>/dev/null || echo 0)
            peak=0
            if [ "$mem_max" != "max" ] && [ "$mem_max" -gt 0 ] 2>/dev/null; then
              threshold=$((mem_max * 92 / 100))
              while kill -0 "$pid" 2>/dev/null; do
                cur=$(cat "$cur_file" 2>/dev/null || echo 0)
                # Working set, as kubelet counts it: memory.current less reclaimable inactive page cache,
                # which builds up when one step runs the tool many times and is freed before any OOM-kill.
                inactive=$(awk '$1 == "inactive_file" { print $2 }' "$stat_file" 2>/dev/null)
                [ -n "$inactive" ] && cur=$((cur - inactive))
                [ "$cur" -gt "$peak" ] 2>/dev/null && peak=$cur
                if [ "$cur" -gt "$threshold" ] 2>/dev/null; then
                  echo "govulncheck: usage $cur bytes exceeded 92% of cgroup limit $mem_max - self-terminating before kernel OOM-kill" >&2
                  kill -TERM "$pid" 2>/dev/null
                  sleep 2
                  kill -KILL "$pid" 2>/dev/null
                  wait "$pid" 2>/dev/null
                  exit 99
                fi
                sleep 1
              done
            fi
            wait "$pid"
            rc=$?
            [ "$peak" -gt 0 ] && echo "govulncheck: peak working set $peak bytes of cgroup limit $mem_max" >&2
            exit $rc'# sh
            true
          } catch {|e| log $"govulncheck ($bin): ($e.msg)"; false })
          if not $ok { $failed = ($failed | append $bin) }
        }

        # Most severe level per vuln across binaries: called in one binary (error) beats merely
        # imported (warning) or required (note) in another.
        let rank = {error: 3, warning: 2, note: 1}
        # A package scan reports any imported vulnerable package at level error, though it never looked
        # at calls. Only a symbol scan can say "called", so package-scan errors count as warnings.
        let docs = ($bins | where {|b| $b not-in $failed} | each {|b|
          let doc = (open --raw $"govulncheck-($b).sarif" | from json)
          if $b in $package_bins {
            let demoted = ($doc | get -o runs.0.results | default []
              | each {|r| if $r.level == "error" { $r | update level "warning" } else { $r } })
            $doc | update runs.0.results $demoted
          } else { $doc }
        })
        if ($docs | is-not-empty) {
          let merged_results = ($docs | each {|d| $d | get -o runs.0.results | default []} | flatten
            | group-by ruleId | values
            | each {|g| $g | sort-by --reverse {|r| $rank | get -o $r.level | default 0} | first})
          let merged_rules = ($docs | each {|d| $d | get -o runs.0.tool.driver.rules | default []} | flatten | uniq-by id)
          $docs | first | update runs.0.results $merged_results | update runs.0.tool.driver.rules $merged_rules
            | to json | save -f govulncheck.sarif
        }
        # A binary the watchdog stopped has no findings to report, so the scan as a whole is incomplete.
        # Fail after merging so the Security tab still gets every binary that did finish.
        if ($failed | is-not-empty) {
          error make {msg: $"govulncheck: scan did not finish for ($failed | str join ', ') (memory watchdog or error)"}
        }

        let accepted = (if (".govulncheck-accepted.json" | path exists) { open --raw ".govulncheck-accepted.json" | from json } else { [] })
        let accepted_ids = ($accepted | get -o id | default [])
        let results = (open --raw govulncheck.sarif | from json | get -o runs.0.results | default [])
        # level == error is govulncheck's "your code calls this" — the only level worth failing on.
        let called = ($results | where level == "error" | get ruleId | uniq)
        let reported = ($results | get ruleId | uniq)
        let unexpected = ($called | where {|id| $id not-in $accepted_ids})
        let stale = ($accepted_ids | where {|id| $id not-in $reported})

        log $"govulncheck: ($results | length) findings, ($called | length) reachable, ($accepted_ids | length) accepted"
        if ($results | is-not-empty) {
          print ($results | each {|r| {
            id: $r.ruleId
            level: $r.level
            accepted: (if $r.ruleId in $accepted_ids { "yes" } else { "" })
            summary: ($r.message.text | str replace --all (char newline) " ")
          } } | sort-by level id | table --width 160)
        }

        # A stale entry is a red check on purpose: it is the only thing stopping the allowlist
        # decaying into blanket suppression once upstream ships a fix.
        if ($stale | is-not-empty) {
          for id in $stale {
            let e = ($accepted | where id == $id | first)
            log $"STALE: ($id) is accepted but no longer reported. ($e.review)"
          }
          error make {msg: $"govulncheck: remove ($stale | str join ', ') from .govulncheck-accepted.json — no longer reported"}
        }

        # error make, never exit: nushell's exit kills the process before tektonic's try/catch can
        # persist the code to /tekton/home/.exit-code, and report-status would call this green.
        if ($unexpected | is-not-empty) {
          error make {msg: $"govulncheck: ($unexpected | length) unaccepted reachable vulnerabilities: ($unexpected | str join ', ')"}
        }

        log $"OK: no unaccepted reachable vulnerabilities; ($accepted_ids | length) accepted"
        }
        if ($env.TEKTONIC_OUTPUT_CAPTURED? | is-empty) {
          try { "" | save -f /tekton/home/.step-output-govulncheck-scan }
          try { ^chmod 0666 /tekton/home/.step-output-govulncheck-scan }
          let rc = (with-env {TEKTONIC_OUTPUT_CAPTURED: "1"} { ^$nu.current-exe $env.CURRENT_FILE o+e>| tee { print -n -r } | tee { save -f /tekton/home/.step-output-govulncheck-scan } | complete | get exit_code })
          try {
            let b = (open --raw /tekton/home/.step-output-govulncheck-scan | into binary)
            if ($b | bytes length) > 60000 { $b | bytes at (-60000).. | save -f /tekton/home/.step-output-govulncheck-scan }
          }
          exit $rc
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [govulncheck-scan/govulncheck-scan]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: sarif-upload-govulncheck
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def main [] {
        print "upload-sarif [govulncheck]: start"

        if not ("govulncheck.sarif" | path exists) or (ls "govulncheck.sarif" | get size.0) == 0B {
          print "upload-sarif [govulncheck]: no sarif produced, skipping"
          return
        }

        # code-scanning wants a full ref; PAC's source-branch is the short name on push, a ref on tag.
        let ref_raw = "$(params.source-branch)"
        let ref = if ($ref_raw | str starts-with "refs/") { $ref_raw } else { $"refs/heads/($ref_raw)" }
        print $"upload-sarif [govulncheck]: ref=($ref)"

        # GitHub has no top-level category field (passing one returns 422). The category lives
        # INSIDE the SARIF as runs[].automationDetails.id, which is also how GitHub keeps analyses
        # distinct — essential here since grype-go and grype-web share the tool name grype and
        # would otherwise overwrite each other on the same ref.
        let sarif_json = (open --raw "govulncheck.sarif" | from json)
        let ad = { id: "govulncheck/" }
        let runs2 = ($sarif_json.runs | each { |r| $r | upsert automationDetails $ad })
        let sarif_b64 = ($sarif_json | upsert runs $runs2 | to json -r | ^gzip -c | encode base64)
        let url = "https://api.github.com/repos/$(params.repo-full-name)/code-scanning/sarifs"
        let body = { commit_sha: "$(params.revision)", ref: $ref, sarif: $sarif_b64 }

        # --allow-errors + --full so a non-2xx (e.g. 403 missing security_events scope, 422 ref
        # mismatch) is captured and logged instead of thrown — the status/body tells us exactly why.
        # Wrapped in try only to survive genuine network errors. Note: interpolated strings must not
        # contain bare parentheses (nushell evaluates them), so keep log text paren-free.
        let resp = (try {
          http post $url $body -t application/json --full --allow-errors -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
        } catch { |e| print $"upload-sarif [govulncheck]: request error - ($e.msg)"; null })

        if $resp != null {
          let status = ($resp.status? | default 0)
          if $status >= 200 and $status < 300 {
            print $"upload-sarif [govulncheck]: uploaded ok, status ($status)"
          } else {
            print $"upload-sarif [govulncheck]: upload failed, status ($status)"
            print ($resp.body? | default "" | to text)
          }
        }
        }

        # Never affect the task's scan verdict: a malformed SARIF, a missing gzip, or any other raise
        # inside main is logged and swallowed here rather than becoming the step's exit code.
        try { main } catch { |e| print $"upload-sarif [govulncheck]: error - ($e.msg)" }
        exit 0
    - computeResources:
        requests:
          cpu: 10m
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: save-go-cache-cache
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (try { open --raw /tekton/home/.cache-go-cache-hash | str trim } catch { "" })
        if ($hash | is-empty) { log "save-go-cache-cache: no hash, skipping"; exit 0 }

        let archive = $"$(workspaces.go-cache.path)/($hash).tar.zst"
        if ($archive | path exists) { log $"save-go-cache-cache: ($hash) exists, skipping"; exit 0 }

        let paths = [".go-mod", ".go-build"] | where { |p| ($p | path exists) }
        if ($paths | is-empty) { log "save-go-cache-cache: no paths to cache"; exit 0 }

        for p in $paths { ^chmod -R u+w $p }

        let max = 3
        if $max > 0 {
          let entries = (try { ls $(workspaces.go-cache.path)/*.tar.zst | sort-by modified | reverse | skip $max } catch { [] })
          for e in $entries { log $"save-go-cache-cache: evicting ($e.name | path basename)"; rm $e.name }
        }

        let uncompressed = ($paths | each { |p| try { du $p | get apparent.0 | into int } catch { 0 } } | math sum)
        log $"save-go-cache-cache: compressing (($uncompressed / 1_000_000) | math round --precision 1)MB uncompressed ..."
        let t0 = (date now)
        # Write to a temp path and rename into place: a step killed mid-write (OOM, eviction,
        # timeout) must never leave a truncated archive at the real hash-keyed path, since the
        # skip-if-exists guard above means a corrupt archive there would never self-heal.
        let tmp = $"($archive).tmp.(random uuid)"
        # nushell aborts the enclosing block as soon as any external command in the pipe
        # reports a non-zero exit (e.g. tar failing to read one of $paths), so cleanup must
        # live in a catch — code placed after the pipe but outside try/catch never runs.
        try {
          ^tar cf - ...$paths | ^zstd -1 -T1 -o $tmp
        } catch { |e|
          rm -f $tmp
          log $"save-go-cache-cache: compress failed (($e.msg)), discarding partial archive"
          exit 1
        }
        mv -f $tmp $archive
        let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
        let compressed = (ls $archive | get size.0)
        let ratio = ($uncompressed / ($compressed | into int) | math round --precision 1)
        log $"save-go-cache-cache: saved ($compressed) ratio=($ratio)x in ($elapsed)s"
      workingDir: $(workspaces.workspace.path)
    - computeResources:
        requests:
          cpu: 10m
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: git-provider-token
              name: "{{ git_auth_secret }}"
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        def gh [method: string, path: string, body?: record]: nothing -> any {
          let url = $"https://api.github.com/repos/$(params.repo-full-name)($path)"
          let headers = [
            Authorization $"Bearer ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
          match $method {
            "POST" => { http post $url $body -t application/json -H $headers }
            "PATCH" => { http patch $url $body -t application/json -H $headers }
            _ => { http get $url -H $headers }
          }
        }

        def now-iso []: nothing -> string { date now | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ' }

        def param-id [value: string]: nothing -> any { if ($value | str trim) =~ '^\d+$' { $value | str trim } else { null } }

        def format-duration [secs: int]: nothing -> string {
          let secs = ([$secs 0] | math max)
          let h = $secs // 3600
          let m = ($secs mod 3600) // 60
          let s = $secs mod 60
          let pad = { |n| $n | into string | fill -a right -w 2 -c '0' }
          if $h > 0 {
            $"($h)h(do $pad $m)m"
          } else if $m > 0 {
            $"($m)m(do $pad $s)s"
          } else {
            $"($s)s"
          }
        }

        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        let step_codes = ([{ name: "govulncheck-scan", path: "/tekton/steps/step-govulncheck-scan/exitCode", out: "/tekton/home/.step-output-govulncheck-scan" } { name: "sarif-upload-govulncheck", path: "/tekton/steps/step-sarif-upload-govulncheck/exitCode", out: "/tekton/home/.step-output-sarif-upload-govulncheck" }] | each { |s|
          let ran = ($s.path | path exists)
          { name: $s.name, ran: $ran, out: $s.out, code: (if $ran { try { open --raw $s.path | str trim | into int } catch { 0 } } else { 0 }) }
        })
        let exit_code = ([$contract_code ...($step_codes | each { |s| $s.code })] | math max)
        let conclusion = if $exit_code == 0 { "success" } else { "failure" }
        let failed_steps = ($step_codes | where code != 0)
        let result = if $exit_code == 0 {
          "Passed"
        } else if ($failed_steps | is-empty) {
          $"Failed: exit ($exit_code)"
        } else {
          let first = ($failed_steps | first)
          $"Failed: step ($first.name) exited ($first.code)"
        }
        let duration = (try { format-duration ((date now | format date '%s' | into int) - (open --raw /tekton/home/.status-started-at | str trim | into int)) } catch { null })
        let title = if $duration == null { $result } else { $"($result) in ($duration)" }

        let rows = ($step_codes | each { |s|
          let st = if not $s.ran { "did not run" } else if $s.code == 0 { "passed" } else { $"exited ($s.code)" }
          $"| ($s.name) | ($st) |"
        })
        mut summary = (["| Step | Result |" "| --- | --- |" ...$rows] | str join "\n")
        let tail = if ($failed_steps | is-empty) { "" } else {
          try { open --raw ($failed_steps | first | get out) | into string | ansi strip | str trim -r } catch { "" }
        }
        if ($tail | is-not-empty) {
          $summary = ([$summary "" $"### Output of ($failed_steps | first | get name)" "" "~~~~text" $tail "~~~~"] | str join "\n")
        }
        let annotations = if ($tail | is-empty) { [] } else {
          $tail | lines | parse --regex "^(?<path>[\\w./@+-]+\\.[A-Za-z0-9]+):(?<line>\\d+)(?::(?<col>\\d+))?:\\s*(?<message>\\S.*)$" | first 50 | each { |m|
            let line = ($m.line | into int)
            { path: ($m.path | str replace -r '^\./' ''), start_line: $line, end_line: $line, annotation_level: "failure", message: ($m.message | str trim) }
          }
        }

        let output = ({ title: $title, summary: $summary } | merge (if ($annotations | is-empty) { {} } else { { annotations: $annotations } }))
        let body = ({ status: "completed", conclusion: $conclusion, completed_at: (now-iso), output: $output } | merge { details_url: "https://tekton-dashboard.bear-velociraptor.ts.net/#/namespaces/$(context.taskRun.namespace)/taskruns/$(context.taskRun.name)" })
        let id = (try { open --raw /tekton/home/.check-run-id | str trim } catch { param-id "$(params.check-run-id)" })
        log $"("report-status [govulncheck-scan]"): exit-code=($exit_code) conclusion=($conclusion)"
        try {
          if $id != null {
            gh PATCH $"/check-runs/($id)" $body | ignore
          } else {
            gh POST "/check-runs" ($body | merge { name: "govulncheck-scan", head_sha: "$(params.revision)" }) | ignore
          }
          log $"("report-status [govulncheck-scan]"): done"
        } catch { |e|
          log $"("report-status [govulncheck-scan]"): error: ($e.msg)"
        }
  workspaces:
    - name: go-cache
    - name: workspace
