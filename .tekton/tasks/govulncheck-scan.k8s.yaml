apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-govulncheck-scan
  namespace: ocidex-ci
spec:
  params:
    - name: source-branch
      type: string
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    env:
      - name: GOPATH
        value: $(workspaces.workspace.path)/.go-path
      - name: GOMODCACHE
        value: $(workspaces.workspace.path)/.go-mod
      - name: GOCACHE
        value: $(workspaces.workspace.path)/.go-build
      - name: GIT_CONFIG_GLOBAL
        value: $(workspaces.workspace.path)/.gitconfig
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: restore-go-cache-cache
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (
          ["go.sum"]
          | each { |f| if ($f | path exists) { open --raw $f } else { "" } }
          | str join | hash sha256 | str substring 0..15
        )
        $hash | save -f /tekton/home/.cache-go-cache-hash
        if ([".go-mod", ".go-build"] | any { |p| $p | path exists }) {
          log $"restore-go-cache-cache: paths already exist, skipping restore ($hash)"
          exit 0
        }
        let archive = $"$(workspaces.go-cache.path)/($hash).tar.zst"

        if ($archive | path exists) {
          let archive_size = (ls $archive | get size.0)
          log $"restore-go-cache-cache: hit ($hash) size=($archive_size)"
          let cache_paths = [".go-mod", ".go-build"]
          for p in $cache_paths {
            if ($p | path exists) { ^chmod -R u+w $p; rm -rf $p }
          }
          let t0 = (date now)
          ^zstd -d -T1 -c $archive | ^tar xf - -o --no-same-permissions
          let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
          log $"restore-go-cache-cache: restored in ($elapsed)s"
        } else {
          log $"restore-go-cache-cache: miss ($hash)"
        }
      workingDir: $(workspaces.workspace.path)
    - computeResources:
        limits:
          cpu: "2"
          ephemeral-storage: 4Gi
          memory: 10Gi
        requests:
          cpu: 500m
          ephemeral-storage: 2Gi
          memory: 4Gi
      env:
        - name: GOMEMLIMIT
          value: 8GiB
      image: ghcr.io/pfenerty/apko-cicd/govulncheck:1.6.0-go1.26
      name: govulncheck-scan
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        log $"go=(go version) uid=(id -u) pwd=(pwd)"
        ^git config --global --add safe.directory (pwd)
        log "Running govulncheck -format sarif ./cmd/..."
        let watchdog = r#'
        govulncheck -format sarif ./cmd/... > govulncheck.sarif &
        pid=$!
        max_file=/sys/fs/cgroup/memory.max
        cur_file=/sys/fs/cgroup/memory.current
        [ -f "$max_file" ] || max_file=/sys/fs/cgroup/memory/memory.limit_in_bytes
        [ -f "$cur_file" ] || cur_file=/sys/fs/cgroup/memory/memory.usage_in_bytes
        mem_max=$(cat "$max_file" 2>/dev/null || echo 0)
        if [ "$mem_max" != "max" ] && [ "$mem_max" -gt 0 ] 2>/dev/null; then
          threshold=$((mem_max * 92 / 100))
          while kill -0 "$pid" 2>/dev/null; do
            cur=$(cat "$cur_file" 2>/dev/null || echo 0)
            if [ "$cur" -gt "$threshold" ] 2>/dev/null; then
              echo "govulncheck: usage $cur bytes exceeded 92% of cgroup limit $mem_max - self-terminating before kernel OOM-kill" >&2
              kill -TERM "$pid" 2>/dev/null
              sleep 2
              kill -KILL "$pid" 2>/dev/null
              wait "$pid" 2>/dev/null
              exit 99
            fi
            sleep 1
          done
        fi
        wait "$pid"
        '#
        ^sh -c $watchdog govulncheck

        let accepted = (if (".govulncheck-accepted.json" | path exists) { open --raw ".govulncheck-accepted.json" | from json } else { [] })
        let accepted_ids = ($accepted | get -o id | default [])
        let results = (open --raw govulncheck.sarif | from json | get -o runs.0.results | default [])
        # level == error is govulncheck's "your code calls this" — the only level worth failing on.
        let called = ($results | where level == "error" | get ruleId | uniq)
        let reported = ($results | get ruleId | uniq)
        let unexpected = ($called | where {|id| $id not-in $accepted_ids})
        let stale = ($accepted_ids | where {|id| $id not-in $reported})

        log $"govulncheck: ($results | length) findings, ($called | length) reachable, ($accepted_ids | length) accepted"
        if ($results | is-not-empty) {
          print ($results | each {|r| {
            id: $r.ruleId
            level: $r.level
            accepted: (if $r.ruleId in $accepted_ids { "yes" } else { "" })
            summary: ($r.message.text | str replace --all (char newline) " ")
          } } | sort-by level id | table --width 160)
        }

        # A stale entry is a red check on purpose: it is the only thing stopping the allowlist
        # decaying into blanket suppression once upstream ships a fix.
        if ($stale | is-not-empty) {
          for id in $stale {
            let e = ($accepted | where id == $id | first)
            log $"STALE: ($id) is accepted but no longer reported. ($e.review)"
          }
          error make {msg: $"govulncheck: remove ($stale | str join ', ') from .govulncheck-accepted.json — no longer reported"}
        }

        # error make, never exit: nushell's exit kills the process before tektonic's try/catch can
        # persist the code to /tekton/home/.exit-code, and report-status would call this green.
        if ($unexpected | is-not-empty) {
          error make {msg: $"govulncheck: ($unexpected | length) unaccepted reachable vulnerabilities: ($unexpected | str join ', ')"}
        }

        log $"OK: no unaccepted reachable vulnerabilities; ($accepted_ids | length) accepted"
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [govulncheck-scan/govulncheck-scan]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: sarif-upload-govulncheck
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def main [] {
        print "upload-sarif [govulncheck]: start"

        if not ("govulncheck.sarif" | path exists) or (ls "govulncheck.sarif" | get size.0) == 0B {
          print "upload-sarif [govulncheck]: no sarif produced, skipping"
          return
        }

        # code-scanning wants a full ref; PAC's source-branch is the short name on push, a ref on tag.
        let ref_raw = "$(params.source-branch)"
        let ref = if ($ref_raw | str starts-with "refs/") { $ref_raw } else { $"refs/heads/($ref_raw)" }
        print $"upload-sarif [govulncheck]: ref=($ref)"

        # GitHub has no top-level category field (passing one returns 422). The category lives
        # INSIDE the SARIF as runs[].automationDetails.id, which is also how GitHub keeps analyses
        # distinct — essential here since grype-go and grype-web share the tool name grype and
        # would otherwise overwrite each other on the same ref.
        let sarif_json = (open --raw "govulncheck.sarif" | from json)
        let ad = { id: "govulncheck/" }
        let runs2 = ($sarif_json.runs | each { |r| $r | upsert automationDetails $ad })
        let sarif_b64 = ($sarif_json | upsert runs $runs2 | to json -r | ^gzip -c | encode base64)
        let url = "https://api.github.com/repos/$(params.repo-full-name)/code-scanning/sarifs"
        let body = { commit_sha: "$(params.revision)", ref: $ref, sarif: $sarif_b64 }

        # --allow-errors + --full so a non-2xx (e.g. 403 missing security_events scope, 422 ref
        # mismatch) is captured and logged instead of thrown — the status/body tells us exactly why.
        # Wrapped in try only to survive genuine network errors. Note: interpolated strings must not
        # contain bare parentheses (nushell evaluates them), so keep log text paren-free.
        let resp = (try {
          http post $url $body -t application/json --full --allow-errors -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
            X-GitHub-Api-Version "2022-11-28"
          ]
        } catch { |e| print $"upload-sarif [govulncheck]: request error - ($e.msg)"; null })

        if $resp != null {
          let status = ($resp.status? | default 0)
          if $status >= 200 and $status < 300 {
            print $"upload-sarif [govulncheck]: uploaded ok, status ($status)"
          } else {
            print $"upload-sarif [govulncheck]: upload failed, status ($status)"
            print ($resp.body? | default "" | to text)
          }
        }
        }

        # Never affect the task's scan verdict: a malformed SARIF, a missing gzip, or any other raise
        # inside main is logged and swallowed here rather than becoming the step's exit code.
        try { main } catch { |e| print $"upload-sarif [govulncheck]: error - ($e.msg)" }
        exit 0
    - image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: save-go-cache-cache
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let hash = (try { open --raw /tekton/home/.cache-go-cache-hash | str trim } catch { "" })
        if ($hash | is-empty) { log "save-go-cache-cache: no hash, skipping"; exit 0 }

        let archive = $"$(workspaces.go-cache.path)/($hash).tar.zst"
        if ($archive | path exists) { log $"save-go-cache-cache: ($hash) exists, skipping"; exit 0 }

        let paths = [".go-mod", ".go-build"] | where { |p| ($p | path exists) }
        if ($paths | is-empty) { log "save-go-cache-cache: no paths to cache"; exit 0 }

        for p in $paths { ^chmod -R u+w $p }

        let max = 3
        if $max > 0 {
          let entries = (try { ls $(workspaces.go-cache.path)/*.tar.zst | sort-by modified | reverse | skip $max } catch { [] })
          for e in $entries { log $"save-go-cache-cache: evicting ($e.name | path basename)"; rm $e.name }
        }

        let uncompressed = ($paths | each { |p| try { du $p | get apparent.0 | into int } catch { 0 } } | math sum)
        log $"save-go-cache-cache: compressing (($uncompressed / 1_000_000) | math round --precision 1)MB uncompressed ..."
        let t0 = (date now)
        # Write to a temp path and rename into place: a step killed mid-write (OOM, eviction,
        # timeout) must never leave a truncated archive at the real hash-keyed path, since the
        # skip-if-exists guard above means a corrupt archive there would never self-heal.
        let tmp = $"($archive).tmp.(random uuid)"
        # nushell aborts the enclosing block as soon as any external command in the pipe
        # reports a non-zero exit (e.g. tar failing to read one of $paths), so cleanup must
        # live in a catch — code placed after the pipe but outside try/catch never runs.
        try {
          ^tar cf - ...$paths | ^zstd -1 -T1 -o $tmp
        } catch { |e|
          rm -f $tmp
          log $"save-go-cache-cache: compress failed (($e.msg)), discarding partial archive"
          exit 1
        }
        mv -f $tmp $archive
        let elapsed = (((date now) - $t0) | into int) / 1_000_000_000
        let compressed = (ls $archive | get size.0)
        let ratio = ($uncompressed / ($compressed | into int) | math round --precision 1)
        log $"save-go-cache-cache: saved ($compressed) ratio=($ratio)x in ($elapsed)s"
      workingDir: $(workspaces.workspace.path)
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = (["/tekton/steps/step-govulncheck-scan/exitCode" "/tekton/steps/step-sarif-upload-govulncheck/exitCode"] | each { |p| try { open --raw $p | str trim | into int } catch { 0 } })
        let exit_code = ([$contract_code ...$step_codes] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        let desc = if $exit_code == 0 { "Passed" } else { "Failed" }

        log $"report-status [govulncheck-scan]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "govulncheck-scan", description: $desc }

        log $"report-status [govulncheck-scan]: POST ($url)"
        log $"report-status [govulncheck-scan]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [govulncheck-scan]: done"
        } catch { |e|
          log $"report-status [govulncheck-scan]: error: ($e.msg)"
        }
  workspaces:
    - name: go-cache
    - name: workspace
