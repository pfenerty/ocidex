apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-tekton-check
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - computeResources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 200m
          memory: 512Mi
      image: ghcr.io/pfenerty/apko-cicd/nodejs:24
      name: synth-drift
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        cd .tektonic
        ^npm ci
        ^npx tektonic check
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error [tekton-check/synth-drift]: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = (["/tekton/steps/step-synth-drift/exitCode"] | each { |p| try { open --raw $p | str trim | into int } catch { 0 } })
        let exit_code = ([$contract_code ...$step_codes] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        let desc = if $exit_code == 0 { "Passed" } else { "Failed" }

        log $"report-status [tekton-check]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "tekton-check", description: $desc }

        log $"report-status [tekton-check]: POST ($url)"
        log $"report-status [tekton-check]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [tekton-check]: done"
        } catch { |e|
          log $"report-status [tekton-check]: error: ($e.msg)"
        }
        exit $exit_code
  workspaces:
    - name: workspace
