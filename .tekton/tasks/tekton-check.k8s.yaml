apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ocidex-tekton-check
  namespace: ocidex-ci
spec:
  params:
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - computeResources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 200m
          memory: 512Mi
      image: ghcr.io/pfenerty/apko-cicd/nodejs:24
      name: synth-drift
      onError: continue
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        if not ("/tekton/home/.exit-code" | path exists) { try { "0" | save -f /tekton/home/.exit-code } }
        try { ^chmod 0666 /tekton/home/.exit-code }
        def main [] {
        ^git config --global --add safe.directory (pwd)
        # npm normalizes github: deps to git+ssh in the lockfile; rewrite to anonymous https so
        # npm ci can fetch the public @pfenerty/tektonic without SSH keys in CI.
        ^git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        cd .tektonic
        # npm 12+ defaults allow-git to "none", blocking the @pfenerty/tektonic git dependency.
        ^npm ci --allow-git=all
        ^npx tsx pipeline.ts
        cd ..
        let drift = (^git status --porcelain -- .tekton | complete | get stdout | str trim)
        if ($drift | is-not-empty) {
          print "✗ .tekton is out of sync with .tektonic/ — run 'make tekton-synth' and commit:"
          print $drift
          # error make, NOT exit 1: tektonic wraps this body in a try/catch and persists the caught
          # code to /tekton/home/.exit-code, which the report-status step reads. nushell's exit kills
          # the process before that wrapper runs, so the file keeps its initial "0" and — with
          # onError: continue on this step — the task reports green on drift. error make throws, so
          # the wrapper sees it. Same reason gofmt-check raises instead of exiting.
          error make {msg: ".tekton is out of sync with .tektonic/"}
        }
        print "✓ .tekton is in sync with .tektonic/"
        }
        let __tek_rc = (try { main; 0 } catch { |e| print $"error: ($e.msg)"; 1 })
        let __tek_prev = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 0 })
        let __tek_worst = ([$__tek_prev $__tek_rc] | math max)
        $"($__tek_worst)" | save -f /tekton/home/.exit-code
        exit $__tek_rc
    - env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: github-pipeline-token
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let exit_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        let state = if $exit_code == 0 { "success" } else { "failure" }
        let desc = if $exit_code == 0 { "Passed" } else { "Failed" }

        log $"report-status [tekton-check]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "tekton-check", description: $desc }

        log $"report-status [tekton-check]: POST ($url)"
        log $"report-status [tekton-check]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [tekton-check]: done"
        } catch { |e|
          log $"report-status [tekton-check]: error: ($e.msg)"
        }
        exit $exit_code
  workspaces:
    - name: workspace
