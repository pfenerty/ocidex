          - name: revision
            value: $(params.revision)
        runAfter:
          - go-test
          - go-integration-test
          - openapi-verify
          - image-build-provenance-worker
          - set-status-pending-ocidex-push
        taskRef:
          kind: Task
          name: ocidex-image-build-vuln-worker
        workspaces:
          - name: buildkit-cache
            workspace: buildkit-cache
          - name: workspace
            workspace: workspace
      - name: image-build-web
        params:
          - name: repo-full-name
            value: $(params.repo-full-name)
          - name: revision
            value: $(params.revision)
        runAfter:
          - go-test
          - go-integration-test
          - openapi-verify
          - image-build-vuln-worker
          - set-status-pending-ocidex-push
        taskRef:
          kind: Task
          name: ocidex-image-build-web
        workspaces:
          - name: buildkit-cache
            workspace: buildkit-cache
          - name: workspace
            workspace: workspace
      - name: image-build-k8s-agent
        params:
          - name: repo-full-name
            value: $(params.repo-full-name)
          - name: revision
            value: $(params.revision)
        runAfter:
          - go-test
          - go-integration-test
