            workspace: buildkit-cache
          - name: workspace
            workspace: workspace
      - name: image-build-scanner-worker
        params:
          - name: repo-full-name
            value: $(params.repo-full-name)
          - name: revision
            value: $(params.revision)
        runAfter:
          - go-test
          - go-integration-test
          - openapi-verify
          - image-build-api
          - set-status-pending-ocidex-push
        taskRef:
          kind: Task
