    workspaces:
      - name: workspace
      - name: go-cache
      - name: node-cache
      - name: buildkit-cache
  taskRunTemplate:
    podTemplate:
      env:
        - name: PAC_EVENT_TYPE
          value: "{{ event_type }}"
        - name: PAC_TARGET_BRANCH
          value: "{{ target_branch }}"
        - name: HOME
          value: /tekton/home
      securityContext:
        fsGroup: 1024
        runAsGroup: 1024
        runAsNonRoot: true
        runAsUser: 1024
        seccompProfile:
          type: RuntimeDefault
    serviceAccountName: default
  timeouts:
    pipeline: 3h
  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
    - name: go-cache
      persistentVolumeClaim:
        claimName: ocidex-go-cache
    - name: node-cache
      persistentVolumeClaim:
        claimName: ocidex-node-cache
    - name: buildkit-cache
      persistentVolumeClaim:
        claimName: ocidex-buildkit-cache
