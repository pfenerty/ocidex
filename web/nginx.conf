# nginx config for the OCIDex web image (cgr.dev/chainguard/nginx).
#
# This replaces /etc/nginx/nginx.conf wholesale rather than dropping a file into
# conf.d/, because the image ships conf.d/nginx.default.conf (a full server{}
# block) and there is no shell in the image to remove it.
#
# Deliberately no reverse proxy: /api, /auth, /health and /ready are routed to
# the API by the Gateway HTTPRoute (charts/ocidex/templates/httproutes.yaml).
# Keeping upstreams out of here also means nginx has no hostname to resolve at
# config-load time, so the container starts even when the API is down.
#
# The image runs as UID 65532, so: no `user` directive (it needs root), and
# listen on 8080 rather than 80. The compiled-in pid path (/run/nginx.pid) and
# temp paths (/var/lib/nginx/tmp/*) are already writable by that UID.

worker_processes  auto;

error_log  /dev/stderr  notice;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # Parity with the Caddyfile's `encode gzip`. In production Cloudflare
    # compresses at the edge; this covers compose and direct access.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/wasm
                      image/svg+xml;

    server {
        listen 8080;

        root /srv;

        # Security headers (ocidex-mqav.7). Server level, so the SPA and the
        # compose proxy locations included below both inherit them — which
        # holds only while no location declares an add_header of its own.
        #
        # The CSP is what the built SPA needs and no more: its own bundle, the
        # Google Fonts stylesheet and font files (web/src/index.css), data: for
        # the inline SVG icons, and the API on the same origin — no deployment
        # sets VITE_API_URL, so the SPA only ever fetches 'self'. A deployment
        # that builds the SPA against an API on another origin must add that
        # origin to connect-src. No 'unsafe-inline' anywhere: a static JSX
        # `style` compiles into template HTML and would be blocked, which
        # web/scripts/check-inline-styles.mjs fails the build on; styles
        # computed at runtime go through CSSOM and are not subject to CSP. HSTS is the TLS terminator's job (ingress or
        # Cloudflare), not this http listener's.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # SPA fallback: unknown paths render index.html and the client router
        # takes over.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Extension point for deployments that have no L7 router in front of
        # them — docker-compose mounts its proxy rules here. A wildcard include
        # matching zero files is not an error, so the image ships nothing.
        include /etc/nginx/ocidex.d/*.conf;
    }
}
