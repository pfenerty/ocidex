# docker-compose only — mounted at /etc/nginx/ocidex.d/proxy.conf and included
# from inside the server{} block in web/nginx.conf.
#
# In Kubernetes this file is absent: the Gateway HTTPRoute routes these paths to
# the API Service before traffic ever reaches the web pod. Compose has no L7
# router, so it needs nginx to do the same job — which is why this lives outside
# the image rather than in web/nginx.conf.
#
# `ocidex` is the compose service name for the API; depends_on guarantees it
# resolves by the time nginx loads this config.

# Server context (the include site is inside server{}), so the four locations
# below inherit these. Host must be the client's Host, not the upstream's: the
# GitHub OAuth redirect is derived from r.Host. web/vite.config.ts sets
# changeOrigin: false for the same reason.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location /api/ {
    proxy_pass http://ocidex:8080;
}

location /auth/ {
    proxy_pass http://ocidex:8080;
}

location = /health {
    proxy_pass http://ocidex:8080;
}

location = /ready {
    proxy_pass http://ocidex:8080;
}
