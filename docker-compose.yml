services:
  postgres:
    image: docker.io/postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    container_name: ocidex-postgres
    restart: always
    environment:
      POSTGRES_USER: ocidex
      POSTGRES_PASSWORD: ocidex
      POSTGRES_DB: ocidex
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocidex"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: docker.io/nats:2-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a
    container_name: ocidex-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    container_name: ocidex-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ocidex:ocidex@postgres:5432/ocidex?sslmode=disable
    command: ["migrate", "up"]

  ocidex:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    container_name: ocidex-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Distributed topology: scanner-worker + per-enricher workers consume from NATS.
      # FRONTEND_URL, CORS_ALLOWED_ORIGINS, GITHUB_REDIRECT_URL come from .env so
      # tailnet/remote hostnames work without compose edits.
      DATABASE_URL: postgres://ocidex:ocidex@postgres:5432/ocidex?sslmode=disable
      NATS_URL: nats://nats:4222
      PORT: "8080"
      LOG_LEVEL: info
      ENVIRONMENT: development
      # Registries here are on the compose network or the host (ocidex-avsz.6).
      EGRESS_ALLOW_PRIVATE: "true"
    # Optional, so `make demo` (docker-compose.demo.yml) runs with no .env at all.
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"

  scanner-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: scanner-worker
    container_name: ocidex-scanner-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ocidex:ocidex@postgres:5432/ocidex?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
      ENVIRONMENT: development
      # Registries here are on the compose network or the host (ocidex-avsz.6).
      EGRESS_ALLOW_PRIVATE: "true"

  # Per-enricher microservices (ADR-033). Each worker claims only its own
  # enricher_name partition from enrichment_jobs and runs a single enricher.
  # Together they replaced the monolithic enrichment-worker, removed in ocidex-kg5.
  # Resolvers (insecure-host, credentials, trust) are DB-backed, so no extra env.
  oci-metadata-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: oci-metadata-worker
    container_name: ocidex-oci-metadata-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ocidex:ocidex@postgres:5432/ocidex?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
      ENVIRONMENT: development
      # Registries here are on the compose network or the host (ocidex-avsz.6).
      EGRESS_ALLOW_PRIVATE: "true"

  git-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: git-worker
    container_name: ocidex-git-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ocidex:ocidex@postgres:5432/ocidex?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
      ENVIRONMENT: development
      # Registries here are on the compose network or the host (ocidex-avsz.6).
      EGRESS_ALLOW_PRIVATE: "true"

  user-enricher-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: user-enricher-worker
    container_name: ocidex-user-enricher-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ocidex:ocidex@postgres:5432/ocidex?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
      ENVIRONMENT: development
      # Registries here are on the compose network or the host (ocidex-avsz.6).
      EGRESS_ALLOW_PRIVATE: "true"

  provenance-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: provenance-worker
    container_name: ocidex-provenance-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ocidex:ocidex@postgres:5432/ocidex?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
      ENVIRONMENT: development
      # Registries here are on the compose network or the host (ocidex-avsz.6).
      EGRESS_ALLOW_PRIVATE: "true"

  # Vulnerability worker: matches stored SBOMs against the grype database (ADR-049)
  # on a schedule (no NATS). Talks to Postgres and the grype database listing.
  # Singleton via a Postgres advisory lock, so scaling to >1 is safe. A short refresh
  # interval is set here so newly ingested SBOMs light up quickly during local
  # exploration.
  #
  # The database (~3 GB unpacked) needs a writable directory. The image runs as
  # distroless nonroot (uid 65532) and has no /var/lib/ocidex, the default
  # VULN_DB_DIR, so without this volume the download can never install and every
  # SBOM stays "not scanned" (ocidex-mxy0.11). The volume mounts over
  # /home/nonroot, which the image owns as 65532, so Docker gives the new volume
  # that owner; TMPDIR sits on it too, since grype unpacks the download there.
  vuln-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: vuln-worker
    container_name: ocidex-vuln-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ocidex:ocidex@postgres:5432/ocidex?sslmode=disable
      LOG_LEVEL: info
      ENVIRONMENT: development
      VULN_REFRESH_ENABLED: "true"
      VULN_REFRESH_INTERVAL: "10m"
      VULN_DB_DIR: /home/nonroot/grype-db
      TMPDIR: /home/nonroot
    volumes:
      - grype-db:/home/nonroot

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: ocidex-web
    restart: unless-stopped
    depends_on:
      - ocidex
    # The image serves static assets only. In k8s the Gateway HTTPRoute routes
    # /api and /auth to the API; compose has no L7 router, so it mounts the
    # equivalent nginx rules here. nginx runs as UID 65532, hence 8080.
    volumes:
      - ./web/nginx.compose.conf:/etc/nginx/ocidex.d/proxy.conf:ro
    ports:
      - "3000:8080"

volumes:
  db-data:
  nats-data:
  zot-data:
  grype-db:
