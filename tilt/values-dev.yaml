image:
  registry: ""
  pullPolicy: IfNotPresent

# Applies the schema to the dev Postgres in tilt/postgres.yaml. Tilt runs the
# hook Job as an ordinary resource (ocidex-migrate-1) gated on postgres.
migrate:
  enabled: true

# The dev registry is the host's bridge address (10.5.0.1:5005), and anything
# else scanned locally is on a private network too.
egressGuard:
  allowPrivate: true

api:
  replicas: 1
  env:
    environment: development
    logLevel: debug
    natsStreamReplicas: "1"

scannerWorker:
  replicas: 1
  env:
    natsStreamReplicas: "1"
    databaseMaxConnections: "3"
    environment: development
    logLevel: debug

enricherWorkerDefaults:
  replicas: 1
  env:
    natsStreamReplicas: "1"
    databaseMaxConnections: "3"
    environment: development
    logLevel: debug

nats:
  storage:
    emptyDir: true
