# gitleaks configuration for the OCIDex secrets-scan CI task.
# Extends the built-in ruleset and allowlists test files — fixtures use fake
# credentials, not real secrets (mirrors .golangci.yml excluding gosec on _test.go).
[extend]
useDefault = true

[allowlist]
description = "Test fixtures use fake credentials, not real secrets"
paths = [
  '''_test\.go$''',
  '''(^|/)testdata/''',
  '''\.(test|spec)\.(ts|tsx|js|jsx)$''',
]

# A public key fingerprint (cosign's, or ssh-keygen -l's: "SHA256:" + 43 base64
# characters) identifies a key; it is not a credential. Issue notes quote them
# when diagnosing signature verification (ocidex-nps9.6), and the generic-api-key
# rule's entropy check flagged one.
regexTarget = "line"
regexes = [
  '''SHA256:[A-Za-z0-9+/]{43}\b''',
]
